<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mapeamento de Líderes CRV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: cabeçalho institucional, abas fixas, painéis em grade; ficha individual em duas colunas (lista + folha). */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#13202b; --muted:#5a6772; --line:#dfe5e3; --soft:#f4f7f6;
  --navy:#0b2540; --green:#17754f; --green-soft:#e3f3ea; --gold:#c9962b; --gold-soft:#fbf3e1; --on-dark:#ffffff;
  --d:#d9483b; --i:#e2a91a; --s:#17754f; --c:#2f6fd0;
  --gato:#17754f; --tub:#2f6fd0; --lobo:#7b8794; --aguia:#e2a91a;
  --bad:#b42318; --bad-bg:#fdecea; --warn:#8a5a00; --warn-bg:#fff3d6; --ok:#17654a; --ok-bg:#e3f3ea; --info:#1f4f9c; --info-bg:#e6eefb;
  --shadow:0 1px 2px rgba(19,32,43,.05),0 10px 26px rgba(19,32,43,.07);
  --font:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1216; --surface:#131d23; --ink:#e6edf0; --muted:#98a7b0; --line:#243139; --soft:#19252c;
    --navy:#7fa6d6; --green:#54c596; --green-soft:#12301f; --gold:#e3b456; --gold-soft:#2c2412; --on-dark:#ffffff;
    --d:#f0796d; --i:#f2c14e; --s:#54c596; --c:#6fa3f0;
    --gato:#54c596; --tub:#6fa3f0; --lobo:#9aa7b3; --aguia:#f2c14e;
    --bad:#ff8a7a; --bad-bg:#3a1714; --warn:#f2c14e; --warn-bg:#3a2c0c; --ok:#5fd3a5; --ok-bg:#0f2e23; --info:#8fb8f5; --info-bg:#14243d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1216; --surface:#131d23; --ink:#e6edf0; --muted:#98a7b0; --line:#243139; --soft:#19252c;
  --navy:#7fa6d6; --green:#54c596; --green-soft:#12301f; --gold:#e3b456; --gold-soft:#2c2412; --on-dark:#ffffff;
  --d:#f0796d; --i:#f2c14e; --s:#54c596; --c:#6fa3f0;
  --gato:#54c596; --tub:#6fa3f0; --lobo:#9aa7b3; --aguia:#f2c14e;
  --bad:#ff8a7a; --bad-bg:#3a1714; --warn:#f2c14e; --warn-bg:#3a2c0c; --ok:#5fd3a5; --ok-bg:#0f2e23; --info:#8fb8f5; --info-bg:#14243d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
/* cabeçalho */
header{background:linear-gradient(115deg,#0b2540 0%,#10405a 55%,#17754f 100%);color:#fff;position:relative;overflow:hidden}
header::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#c9962b,#f0d48a,#c9962b)}
.hd{padding-block:24px 22px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end;position:relative}
.brandrow{display:flex;gap:18px;align-items:center;min-width:0}
.logo{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);flex:none}
.logo img{display:block;height:56px;width:auto}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#f0d48a;font-weight:800}
h1{margin:4px 0 2px;font-size:clamp(22px,3.2vw,31px);font-weight:800;letter-spacing:-.01em}
.sub{opacity:.88;font-size:14px}
.hd-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hbtn{cursor:pointer;font-size:13px;font-weight:800;padding:9px 15px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn.gold{background:#c9962b;border-color:#c9962b;color:#1b1503}
.hbtn.gold:hover{background:#d9a83d}
/* abas */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.navin{display:flex;gap:2px;overflow-x:auto}
.navin button{font-weight:800;font-size:14px;border:0;background:none;color:var(--muted);padding:14px 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.navin button:hover{color:var(--ink)}
.navin button.on{color:var(--ink);border-bottom-color:var(--green)}
.cnt{display:inline-block;margin-left:6px;font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 8px}
.view{padding-block:22px 44px;display:grid;gap:18px}
.view>*{min-width:0}
.state{margin:40px auto;max-width:560px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:34px 24px}
.state b{color:var(--ink);display:block;font-size:17px;margin-bottom:6px}
/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-size:16px;font-weight:800}
.hint{margin:2px 0 14px;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--k,var(--green));border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);text-align:left;cursor:pointer;min-width:0}
.kpi:hover{background:var(--soft)}
.kpi .lb{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:31px;font-weight:800;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .ft{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g2>*{min-width:0}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--soft);text-align:left;min-width:0}
.step:hover{border-color:var(--green)}
.step .n{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.step .t{font-weight:800;font-size:13.5px;line-height:1.25;margin:2px 0 8px}
.step .q{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.step .q small{font-size:12px;color:var(--muted);font-weight:700}
.trk{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.trk i{display:block;height:100%;background:var(--green);border-radius:4px}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rd{border-left:4px solid var(--rc,var(--green));background:var(--soft);border-radius:0 12px 12px 0;padding:12px 14px;font-size:13.5px;min-width:0}
.rd b.t{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.rd p{margin:0 0 6px}.rd p:last-child{margin:0}
.tg{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:999px;margin-right:5px;white-space:nowrap}
.tg.dado{background:var(--info-bg);color:var(--info)}.tg.lei{background:var(--warn-bg);color:var(--warn)}.tg.rec{background:var(--ok-bg);color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.brow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 34px;gap:10px;align-items:center;padding:6px 4px;cursor:pointer;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.brow:hover{background:var(--soft)}
.bname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{height:18px;background:var(--soft);border-radius:6px;display:flex;overflow:hidden}
.seg{height:100%}.seg+.seg{border-left:2px solid var(--surface)}
.btot{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.discg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.dcol{text-align:center;cursor:pointer;border:0;background:none;padding:0;min-width:0}
.dbar{height:120px;background:var(--soft);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.dbar i{display:block;width:100%;border-radius:8px 8px 0 0}
.dcol b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.dcol span{font-size:12px;color:var(--muted);font-weight:700}
.mx{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;font-size:13px}
.mx .h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);align-self:center}
.cell{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:64px;background:var(--soft);min-width:0}
.cell .n{font-size:20px;font-weight:800}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--green)}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.b-ok{color:var(--ok);background:var(--ok-bg)}.b-warn{color:var(--warn);background:var(--warn-bg)}.b-bad{color:var(--bad);background:var(--bad-bg)}.b-info{color:var(--info);background:var(--info-bg)}.b-n{color:var(--muted);background:var(--soft);border:1px solid var(--line)}
/* tabela */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select,.fld input,.fld select,.fld textarea{font-size:13.5px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
.toolbar .sp{flex:1}
.b2{font-size:13px;font-weight:800;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.b2:hover{background:var(--soft)}
.b2.pri{background:var(--green);border-color:var(--green);color:var(--surface)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--soft)}
td.hot{color:var(--bad);font-weight:800}
.mini{display:inline-flex;gap:2px;align-items:flex-end;height:22px;vertical-align:middle}
.mini i{display:block;width:7px;border-radius:2px 2px 0 0}
/* ficha */
.nom{display:grid;grid-template-columns:270px 1fr;gap:18px}
.nom>*{min-width:0}
.roster{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;align-self:start;position:sticky;top:calc(60px + env(safe-area-inset-top,0px))}
.ri{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.ri:hover{background:var(--soft)}
.ri.on{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green)}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;background:linear-gradient(135deg,#0b2540,#17754f);flex:none}
.ri .nm{font-size:13px;font-weight:800;line-height:1.2}
.ri .fn{font-size:11px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;margin-left:auto;flex:none;background:var(--line)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.sh-top{background:linear-gradient(115deg,#0b2540,#10405a 60%,#17754f);color:#fff;padding:20px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:3px solid #c9962b}
.sh-top .av{width:60px;height:60px;font-size:20px;border-radius:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.sh-name{font-size:21px;font-weight:800;line-height:1.2}
.sh-role{opacity:.9;font-size:13px}
.sh-nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sh-body{padding:20px 22px;display:grid;gap:20px}
.sh-body>*{min-width:0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fact{background:var(--soft);border-radius:12px;padding:9px 12px;min-width:0}
.fact span{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.fact b{font-size:14px;overflow-wrap:anywhere}
.h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px}
.alert{display:grid;gap:4px;font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px}
.alert b{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.txt{font-size:14px;color:var(--ink)}
.pbar{display:grid;grid-template-columns:118px 1fr 44px;gap:10px;align-items:center;font-size:13px;font-weight:700;margin-bottom:6px}
.pbar .t{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.pbar .t i{display:block;height:100%;border-radius:7px}
.pbar b{text-align:right;font-variant-numeric:tabular-nums}
.tl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.tl .d{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.reg{border-left:4px solid var(--rc);background:var(--soft);border-radius:0 10px 10px 0;padding:9px 12px;font-size:13.5px;margin-bottom:8px}
.reg b{display:block;font-size:12px}
.qa{display:grid;grid-template-columns:minmax(140px,230px) 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.qa div{background:var(--surface);padding:9px 12px}
.qa .q{font-weight:800;background:var(--soft)}
.x4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.xc{border-top:3px solid var(--xc);background:var(--soft);border-radius:0 0 12px 12px;padding:12px;font-size:13px;min-width:0}
.xc b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--xc);margin-bottom:6px}
.xc ul{margin:0;padding-left:16px}.xc li{margin-bottom:3px}
.note{border-left:4px solid var(--gold);background:var(--gold-soft);padding:12px 16px;border-radius:0 12px 12px 0;font-size:14px}
.par{white-space:pre-line;font-size:14px}
.edit{border:1px solid var(--green);border-radius:14px;padding:16px;background:var(--green-soft)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld.w{grid-column:1/-1}
.fld span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fld textarea{min-height:76px;resize:vertical;width:100%}
.fld input,.fld select{width:100%}
/* perfis */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;min-width:0}
.pc:hover{border-color:var(--green)}
.pc .nm{font-weight:800;font-size:14px;line-height:1.2}
.pc .fn{font-size:12px;color:var(--muted);margin-bottom:10px}
.an{height:12px;border-radius:6px;display:flex;overflow:hidden;background:var(--soft);margin-top:10px}
.pc .lb{font-size:12px;color:var(--muted);margin-top:5px}
/* conferir */
.cf{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.cf:last-child{border:0}
.cf.done{opacity:.55}
.cf input{width:18px;height:18px;margin-top:3px;accent-color:var(--green)}
.cf .w{font-weight:800;font-size:14px}
.cf .w button{border:0;background:none;padding:0;font-weight:800;color:var(--green);cursor:pointer;text-decoration:underline}
.cf p{margin:3px 0 0;font-size:13.5px}
/* modal */
.mb{position:fixed;inset:0;background:rgba(5,12,18,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.md h2{margin:0 0 4px;font-size:17px}.md .hint{margin-bottom:12px}
.pl{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.pl:hover{background:var(--soft)}
.pl .det{font-size:12px;color:var(--muted)}
.ck{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:6px}
.ck input{accent-color:var(--green);width:16px;height:16px}
.md-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b2540;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:#b42318}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.nom{grid-template-columns:1fr}.read{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.x4{grid-template-columns:repeat(2,1fr)}.roster{position:static;display:flex;overflow-x:auto;gap:4px}.ri{flex:none;width:auto}.dot{display:none}.facts{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.wrap{padding-inline:16px}.kpis{grid-template-columns:repeat(2,1fr)}.brandrow{flex-direction:column;align-items:flex-start;gap:12px}.logo img{height:42px}.x4,.fgrid{grid-template-columns:1fr}.qa{grid-template-columns:1fr}.sh-nav{margin-left:0;width:100%}.mx{grid-template-columns:1fr}.mx .h:first-child{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<header>

<script>/*__CRV_DADOS_0__*/

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const title=s=>String(s||'').toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\s(De|Da|Do|Dos|Das|E)\s/g,m=>m.toLowerCase());
const first2=n=>{const a=title(n).split(' ');return a[0]+' '+a[a.length-1]};
const ini=n=>{const a=String(n).split(' ');return (a[0][0]+a[a.length-1][0]).toUpperCase()};
const fmtD=iso=>iso?iso.split('-').reverse().join('/'):'';

const ETAPAS=['Mapeamento RH (4 fontes)','Percepção da gestão (5ª fonte)','Parecer final','Plano de desenvolvimento','Feedback individual RH + gestão'];
const STATUS=['','Aguardando percepção da gestão','Percepção recebida, falta o parecer final','Parecer final emitido, falta o plano','Plano definido, falta o feedback','Feedback realizado'];
const PRONT=['','Pronto para ampliar responsabilidades','Pronto em até 1 ano, com plano','Em desenvolvimento na função atual','Manter na função e acompanhar','Rever adequação à função'];
const DISC=[['D','Dominância','--d'],['I','Influência','--i'],['S','Estabilidade','--s'],['C','Conformidade','--c']];
const ANI=[['Gato','--gato'],['Tubarão','--tub'],['Lobo','--lobo'],['Águia','--aguia']];


let L=[], CF=[], db=null, dl=null, canWrite=true, cur=null, view='geral', loaded={l:false,c:false};
const HOJE=new Date();
function meses(p){const a=new Date(p.adm+'T12:00:00');return Math.max(0,(HOJE.getFullYear()-a.getFullYear())*12+HOJE.getMonth()-a.getMonth()-(HOJE.getDate()<a.getDate()?1:0))}
function casa(p){const m=meses(p);return m<12?m+(m===1?' mês':' meses'):Math.floor(m/12)+' a '+(m%12)+' m'}
const nReg=p=>p.adv.length+p.susp.length;
const g=p=>p.gestao||{etapa:1};
const pend=p=>CF.filter(c=>c.mat===p.mat&&!c.ok);
const temasDe=p=>TEMAS.filter(([t,k])=>p.desenv.some(d=>k.some(x=>norm(d).includes(x)))).map(t=>t[0]);
const predTxt=p=>(p.animalPred||[]).join(' + ');
function badge(txt,kind){return `<span class="badge b-${kind}">${esc(txt)}</span>`}
const potK=n=>n==='Alto'?'ok':n==='Condicionado'?'bad':'warn';
const adK=n=>n==='Boa'?'ok':'warn';
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}

/* ---------- navegação ---------- */
function show(v,top){view=v;$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));['geral','lista','ficha','perfis','conf'].forEach(k=>$('#v-'+k).hidden=k!==v||!L.length);if(top)window.scrollTo({top:0})}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v,1)};
function goFicha(mat){cur=mat;closeModal();renderFicha();show('ficha',1)}
function closeModal(){$('#modal').innerHTML=''}
function modal(html){$('#modal').innerHTML=`<div class="mb" id="mbk"><div class="md" role="dialog" aria-modal="true">${html}</div></div>`;$('#mbk').onclick=e=>{if(e.target.id==='mbk')closeModal()}}
/* clicar em qualquer número, barra ou etiqueta abre quem está por trás */
function openList(tit,sub,items){
  modal(`<h2>${esc(tit)}</h2><div class="hint">${esc(sub||'')} ${items.length} ${items.length===1?'pessoa':'pessoas'}. Clique para abrir a ficha.</div>
  ${items.length?items.map(({p,det})=>`<button class="pl" data-m="${esc(p.mat)}"><span class="av">${ini(p.nome)}</span><span><b>${esc(title(p.nome))}</b><div class="det">${esc(det||p.funcao+' · '+p.frente+(p.turno?' · Turno '+p.turno:''))}</div></span></button>`).join(''):'<div class="hint">Ninguém nesta condição.</div>'}
  <div class="md-act"><button class="b2" id="mClose">Fechar</button></div>`);
  $('#mClose').onclick=closeModal;$$('#modal .pl').forEach(b=>b.onclick=()=>goFicha(b.dataset.m));
}

/* ---------- visão geral ---------- */
function renderGeral(){
  const n=L.length, ag=L.filter(p=>g(p).etapa<2), reg=L.filter(p=>nReg(p)>0), novos=L.filter(p=>meses(p)<12), esc_=L.filter(p=>p.escola), cfp=CF.filter(c=>!c.ok);
  const tAdv=L.reduce((a,p)=>a+p.adv.length,0), tSusp=L.reduce((a,p)=>a+p.susp.length,0);
  const top=[...L].sort((a,b)=>nReg(b)-nReg(a))[0];
  const alto=L.filter(p=>p.potNivel==='Alto'), boa=L.filter(p=>p.aderNivel==='Boa');
  const med=k=>Math.round(L.reduce((a,p)=>a+p.disc[k],0)/n);
  const iBaixo=L.filter(p=>p.disc.I<=35);
  const tem=TEMAS.map(([t])=>({t,ps:L.filter(p=>temasDe(p).includes(t))})).filter(x=>x.ps.length).sort((a,b)=>b.ps.length-a.ps.length);
  const com=tem.find(x=>x.t==='Comunicação');
  const fichasPend=[...new Set(cfp.filter(c=>c.mat).map(c=>c.mat))].length;
  const maxR=Math.max(1,...L.map(nReg));
  const K=[['Líderes mapeados',n,'fichas com as 4 fontes','--green',()=>openList('Líderes mapeados','',L.map(p=>({p})))],

const miniDisc=p=>`<span class="mini">${DISC.map(([k,,c])=>`<i style="height:${Math.max(3,p.disc[k]*.22)}px;background:var(${c})" title="${k} ${p.disc[k]}%"></i>`).join('')}</span>`;
function renderLista(){
  const V=$('#v-lista'), u=k=>[...new Set(L.map(p=>p[k]).filter(Boolean))].sort(), opt=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${esc(x)}</option>`).join('');

    <div class="sh-body">

      <div><div class="h3">1 · Identificação</div><div class="facts">
        <div class="fact"><span>Matrícula</span><b>${p.mat}</b></div><div class="fact"><span>Admissão</span><b>${fmtD(p.adm)}</b></div>
        <div class="fact"><span>Tempo de casa</span><b>${casa(p)}</b></div><div class="fact"><span>Frente de serviço</span><b>${esc(p.frente)}${p.turno?' · Turno '+p.turno:''}</b></div>

        <div class="fact"><span>Escola de Líderes</span><b>${esc(p.escola||'Não consta')}</b></div><div class="fact"><span>Situação</span><b>${STATUS[ge.etapa]||STATUS[1]}</b></div></div>
        ${p.funcaoObs?`<div class="hint" style="margin:8px 0 0">${esc(p.funcaoObs)}</div>`:''}</div>
      <div class="g2">
        <div><div class="h3">2 · Perfil comportamental (DISC) · ${esc(p.discPerfil)}</div>
          ${DISC.map(([k,nm,c])=>`<div class="pbar"><span>${k} · ${nm}</span><span class="t"><i style="width:${p.disc[k]}%;background:var(${c})"></i></span><b>${p.disc[k]}%</b></div>`).join('')}

    ${cnt.map((x,i)=>`<button class="brow" data-a="${i}"><span class="bname">${x.a}</span><span class="btrack"><i class="seg" style="width:${x.ps.length/L.length*100}%;background:var(${x.c})"></i></span><span class="btot">${x.ps.length}</span></button>`).join('')}</div>
  <div class="card"><div class="toolbar" style="margin:0 0 14px"><div><h2>DISC e animais, líder a líder</h2><div class="hint" style="margin:2px 0 0">Para comparar perfis lado a lado. Clique no cartão para abrir a ficha.</div></div><span class="sp"></span>
    <select id="psort" aria-label="Ordenar"><option value="nome">Ordenar por nome</option>${DISC.map(([k,nm])=>`<option value="${k}"${pSort===k?' selected':''}>Maior ${k} · ${nm}</option>`).join('')}</select></div>
    <div class="legend">${DISC.map(([k,nm,c])=>`<span><i style="background:var(${c})"></i>${k} ${nm}</span>`).join('')}</div>
    <div class="pgrid">${arr.map(p=>`<button class="pc" data-m="${p.mat}"><div class="nm">${esc(title(p.nome))}</div><div class="fn">${esc(p.discPerfil)} · ${esc(predTxt(p))}</div>
      ${DISC.map(([k,,c])=>`<div class="pbar" style="grid-template-columns:16px 1fr 40px;margin-bottom:4px"><span>${k}</span><span class="t" style="height:10px"><i style="width:${p.disc[k]}%;background:var(${c})"></i></span><b>${p.disc[k]}%</b></div>`).join('')}
      ${p.animais?`<div class="an">${ANI.map(([a,c])=>`<i style="width:${p.animais[a]}%;background:var(${c})"></i>`).join('')}</div><div class="lb">${ANI.map(([a])=>a+' '+p.animais[a]+'%').join(' · ')}</div>`:'<div class="lb">Animais: percentuais não informados</div>'}</button>`).join('')}</div></div>`;
  $('#psort').onchange=e=>{pSort=e.target.value;renderPerfis()};
  $$('.pc',V).forEach(b=>b.onclick=()=>goFicha(b.dataset.m));
  $$('[data-a]',V).forEach(b=>b.onclick=()=>{const x=cnt[b.dataset.a];openList('Predominante: '+x.a,'',x.ps.map(p=>({p,det:p.animais?x.a+' '+p.animais[x.a]+'% · '+p.discPerfil:p.discPerfil})))});
}

/* ---------- a conferir ---------- */
function renderConf(){
  const V=$('#v-conf'), arr=[...CF].sort((a,b)=>(a.ok-b.ok)||(a.ordem-b.ordem)), pn=CF.filter(c=>!c.ok).length;
  $('#cfCnt').hidden=!pn;$('#cfCnt').textContent=pn;
  V.innerHTML=`<div class="card"><h2>A conferir antes de levar à gestão</h2><div class="hint">Diferenças e lacunas que encontrei ao consolidar as fichas. São apontamentos de leitura, a decisão é sua. ${canWrite?'Marque o item quando estiver resolvido.':''}</div>
  ${arr.map(c=>`<div class="cf${c.ok?' done':''}"><input type="checkbox" id="cf-${c._id}" data-c="${c._id}" ${c.ok?'checked':''} ${canWrite?'':'disabled'} aria-label="Conferido"><div><div class="w">${badge(c.tipo,c.ok?'ok':'warn')} ${c.mat?`<button data-m="${esc(c.mat)}">${esc(c.nome)}</button>`:esc(c.nome)}</div><p>${esc(c.txt)}</p></div></div>`).join('')||'<div class="hint">Nenhum item pendente.</div>'}</div>`;
  $$('[data-m]',V).forEach(b=>b.onclick=()=>goFicha(b.dataset.m));
  $$('[data-c]',V).forEach(b=>b.onchange=()=>{const c=CF.find(x=>x._id===b.dataset.c);c.ok=b.checked;db.collection('conferir').doc(c._id).update({ok:b.checked}).catch(()=>toast('Não foi possível salvar.',true));renderAll()});
}

function renderAll(){
  if(!L.length){$('#state').hidden=false;$('#state').innerHTML='<b>Nenhuma ficha cadastrada ainda</b>Envie as fichas de Mapeamento Individual de Perfil e Potencial no chat para elas entrarem no painel.';return}
  $('#state').hidden=true;renderGeral();renderLista();renderPerfis();renderConf();
  const typing=Date.now()-editAt<4000&&view==='ficha'&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!typing)renderFicha();
  show(view);
}

/* ---------- exportação ---------- */

function tabelas(sel,ps){const T={};
  if(sel.lista)T['Líderes']=[['Nome','Matrícula','Admissão','Tempo de casa','Departamento','Função','Frente','Turno','Escola de Líderes','Advertências','Suspensões','Aderência','Potencial','Situação'],...ps.map(p=>[title(p.nome),p.mat,fmtD(p.adm),casa(p),p.depto,p.funcao,p.frente,p.turno,p.escola,p.adv.length,p.susp.length,p.aderNivel,p.potNivel,STATUS[g(p).etapa]])];
  if(sel.perfis)T['Perfis']=[['Nome','D','I','S','C','Perfil DISC','Gato','Tubarão','Lobo','Águia','Predominante'],...ps.map(p=>[title(p.nome),p.disc.D,p.disc.I,p.disc.S,p.disc.C,p.discPerfil,...ANI.map(([a])=>p.animais?p.animais[a]:''),predTxt(p)])];
  if(sel.disc)T['Registros']=[['Nome','Tipo','Data','Descrição'],...ps.flatMap(p=>[...p.adv.map(a=>[title(p.nome),'Advertência',a[0],a[1]]),...p.susp.map(a=>[title(p.nome),'Suspensão',a[0],a[1]]),...(p.vincAnt?[[title(p.nome),'Vínculo anterior','',p.vincAnt]]:[])])];
  if(sel.cruz)T['Cruzamento']=[['Nome','Forças','Pontos de desenvolvimento','Potencialidades','A validar pela gestão','Parecer preliminar do RH','Achado'],...ps.map(p=>[title(p.nome),p.forcas.join(' '),p.desenv.join(' '),p.potenc.join(' '),p.validar.join(' '),p.parecer,p.achado])];
  if(sel.auto)T['Autopercepção']=[['Nome',...QS],...ps.map(p=>[title(p.nome),...p.auto])];
  if(sel.gestao)T['5ª fonte']=[['Nome','Situação','Gestor','Percepção da gestão','Prontidão','Parecer final','Plano de desenvolvimento','Feedback'],...ps.map(p=>{const e=g(p);return [title(p.nome),STATUS[e.etapa],e.gestor||'',e.percepcao||'',e.prontidao||'',e.parecerFinal||'',e.pdi||'',fmtD(e.feedback||'')]})];
  if(sel.conf)T['A conferir']=[['Ficha','Tipo','Apontamento','Situação'],...CF.filter(c=>!c.mat||ps.some(p=>p.mat===c.mat)).map(c=>[c.nome,c.tipo,c.txt,c.ok?'Conferido':'Pendente'])];
  return T}
const A=s=>String(s??'').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...').replace(/→/g,'>').replace(/[^\x00-\xff]/g,'');
const stamp=()=>HOJE.toISOString().slice(0,10);
async function salvar(nome,data,msg){try{await dl.save({filename:nome,data});toast(msg)}catch(e){const c=e&&e.code;if(c==='declined')return;toast(c==='rate_limited'?'Aguarde um instante e tente de novo.':'Não foi possível gerar o arquivo aqui.',true)}}
function novoPdf(tit,sub,land){const d=new window.jspdf.jsPDF({unit:'pt',format:'a4',orientation:land?'landscape':'portrait'}),W=d.internal.pageSize.getWidth();
  d.setFillColor(11,37,64);d.rect(0,0,W,62,'F');d.setFillColor(201,150,43);d.rect(0,62,W,3,'F');
  try{const im=$('#logoImg'),h=38,w=h*im.naturalWidth/im.naturalHeight;d.setFillColor(255,255,255);d.roundedRect(W-w-46,8,w+12,h+8,5,5,'F');d.addImage(im.src,'PNG',W-w-40,12,w,h)}catch(_){}
  d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(15);d.text(A(tit),36,30);d.setFont('helvetica','normal');d.setFontSize(9.5);d.text(A(sub),36,47);d.setTextColor(20);return d}
function rodape(d){const n=d.internal.getNumberOfPages(),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(110);d.text('CRV Industrial - Gestao de Pessoas - Mapeamento de Lideres - gerado em '+HOJE.toLocaleDateString('pt-BR'),36,H-20);d.text('Pagina '+i+' de '+n,W-36,H-20,{align:'right'})}}
function tab(d,head,body,y,opt){d.autoTable({startY:y,head:[head.map(A)],body:body.map(r=>r.map(A)),margin:{left:36,right:36,bottom:36},styles:{font:'helvetica',fontSize:8,cellPadding:4,overflow:'linebreak',valign:'top'},headStyles:{fillColor:[23,117,79],textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:[244,247,246]},...opt});return d.lastAutoTable.finalY+14}
function abrirExport(){
  const nf=filtrados().length;
  modal(`<h2>Exportar</h2><div class="hint">Escolha o que entra no arquivo.</div>
  ${SECOES.map(([k,t],i)=>`<label class="ck"><input type="checkbox" id="ex-${k}" ${i<3?'checked':''}>${t}</label>`).join('')}
  <label class="fld" style="margin-top:10px"><span>Quem entra</span><select id="ex-esc"><option value="t">Todos os ${L.length} líderes</option>${nf<L.length?`<option value="f">Só os ${nf} filtrados na aba Líderes mapeados</option>`:''}</select></label>
  <div class="md-act"><button class="b2" id="exC">Cancelar</button><button class="b2 pri" id="exX">Gerar Excel</button><button class="b2 pri" id="exP">Gerar PDF</button></div>`);
  $('#exC').onclick=closeModal;
  const pega=()=>{const sel={};SECOES.forEach(([k])=>sel[k]=$('#ex-'+k).checked);if(!Object.values(sel).some(Boolean)){toast('Marque ao menos um item.',true);return null}return tabelas(sel,$('#ex-esc').value==='f'?filtrados():L)};
  $('#exX').onclick=()=>{if(!window.XLSX)return toast('O gerador de Excel não carregou. Confira a internet e recarregue a página.',true);const T=pega();if(!T)return;const wb=XLSX.utils.book_new();Object.entries(T).forEach(([n,rows])=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((h,i)=>({wch:Math.min(60,Math.max(String(h).length+2,...rows.slice(1).map(r=>String(r[i]??'').length+2)))}));XLSX.utils.book_append_sheet(wb,ws,n.replace(/[^\wÀ-ÿ ]/g,'').slice(0,31))});
    closeModal();salvar('Mapeamento_de_Lideres_'+stamp()+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}),'Excel gerado.')};
  $('#exP').onclick=()=>{if(!pdfOk())return;const T=pega();if(!T)return;const d=novoPdf('Mapeamento de Lideres','Operacional CCT - analise RH em 4 fontes',true);let y=84;
    Object.entries(T).forEach(([n,rows])=>{if(y>430){d.addPage();y=40}d.setFont('helvetica','bold');d.setFontSize(11);d.setTextColor(11,37,64);d.text(A(n),36,y);y=tab(d,rows[0],rows.slice(1),y+8,{})});
    rodape(d);closeModal();salvar('Mapeamento_de_Lideres_'+stamp()+'.pdf',d.output('arraybuffer'),'PDF gerado.')};
}
const pdfOk=()=>{if(window.jspdf&&window.jspdf.jsPDF.API.autoTable)return true;toast('O gerador de PDF não carregou. Confira a internet e recarregue a página.',true);return false};
function pdfFicha(p){
  if(!pdfOk())return;
  const d=novoPdf('Mapeamento Individual de Perfil e Potencial',title(p.nome)+' - matricula '+p.mat),e=g(p);let y=84;
  const sec=(t,head,body,opt)=>{if(y>700){d.addPage();y=40}d.setFont('helvetica','bold');d.setFontSize(10.5);d.setTextColor(11,37,64);d.text(A(t),36,y);y=tab(d,head,body,y+7,opt||{})};
  sec('1. Identificacao',['Admissao','Tempo de casa','Departamento','Funcao','Frente / turno','Escola de Lideres'],[[fmtD(p.adm),casa(p),p.depto,p.funcao,p.frente+(p.turno?' / '+p.turno:''),p.escola||'Nao consta']]);
  sec('2. DISC - '+p.discPerfil,['D','I','S','C','Leitura do perfil'],[[p.disc.D+'%',p.disc.I+'%',p.disc.S+'%',p.disc.C+'%',p.discLeitura]],{columnStyles:{4:{cellWidth:340}}});
  sec('3. Perfil dos 4 animais - '+predTxt(p),['Gato','Tubarao','Lobo','Aguia','Leitura'],[[...ANI.map(([a])=>p.animais?p.animais[a]+'%':'-'),p.animalLeitura]],{columnStyles:{4:{cellWidth:340}}});
  sec('4. Historico profissional interno',['Data','Registro'],[...p.hist,...p.adv.map(a=>[a[0],'ADVERTENCIA: '+a[1]]),...p.susp.map(a=>[a[0],'SUSPENSAO: '+a[1]]),...(!nReg(p)?[['','Sem advertencias ou suspensoes no vinculo atual.']]:[]),...(p.vincAnt?[['','VINCULO ANTERIOR: '+p.vincAnt]]:[])],{columnStyles:{0:{cellWidth:70}}});
  sec('5. Autopercepcao',['Pergunta','Resposta'],QS.map((q,i)=>[(i+1)+'. '+q,p.auto[i]]),{columnStyles:{0:{cellWidth:160}}});
  const li=a=>a.map(x=>'- '+x).join('\n');
  sec('6. Cruzamento das 4 fontes',['Forcas','Pontos de desenvolvimento','Potencialidades','A validar pela gestao'],[[li(p.forcas),li(p.desenv),li(p.potenc),li(p.validar)]]);
  sec('7. Aderencia e potencial',['Aderencia: '+p.aderNivel,'Potencial: '+p.potNivel],[[p.aderTxt,p.potTxt]]);
  sec('8. Parecer preliminar do RH',['Parecer'],[[p.parecer]]);
  sec('9. Um achado importante',['Achado'],[[p.achado]]);
  sec('5a fonte - percepcao da gestao',['Ponto a validar','Sim','Em parte','Nao','Comentario do gestor'],p.validar.map(v=>[v,'','','','']),{columnStyles:{0:{cellWidth:220},1:{cellWidth:32},2:{cellWidth:44},3:{cellWidth:32}},styles:{font:'helvetica',fontSize:8,cellPadding:6,minCellHeight:26,lineWidth:.5,lineColor:[200,205,203]}});
  sec('Parecer final e plano',['Situacao','Gestor','Prontidao','Parecer final','Plano de desenvolvimento'],[[STATUS[e.etapa],e.gestor||'',e.prontidao||'',e.parecerFinal||'',e.pdi||'']],{styles:{font:'helvetica',fontSize:8,cellPadding:5,minCellHeight:44,lineWidth:.5,lineColor:[200,205,203]}});
  if(y>740){d.addPage();y=60}y+=26;d.setDrawColor(120);d.line(36,y,250,y);d.line(320,y,540,y);d.setFontSize(8);d.setTextColor(90);d.text('Gestor responsavel / data',36,y+11);d.text('Gestao de Pessoas / data',320,y+11);
  rodape(d);salvar('Mapeamento_'+A(title(p.nome)).replace(/[^A-Za-z0-9]+/g,'_')+'_'+stamp()+'.pdf',d.output('arraybuffer'),'PDF da ficha gerado.');
}

/* ---------- início ---------- */
(async()=>{
  const C=window.claude;
  const [d,u,dw]=C&&C.use?await Promise.all([C.use('db'),C.use('user'),C.use('downloads')]):[null,null,null];
  dl=dw||null;$('#expBtn').hidden=!dl;$('#expBtn').onclick=abrirExport;
  if(!d){$('#state').innerHTML='<b>Os dados deste painel ficam guardados na sua conta</b>Abra o painel conectado ao Claude para ver e editar o mapeamento.';return}
  db=d;try{if(u&&await u.can('data.write')===false)canWrite=false}catch(_){}
  const fail=()=>{$('#state').hidden=false;$('#state').innerHTML='<b>Não foi possível carregar os dados agora</b>Recarregue a página para tentar de novo.'};
  db.collection('lideres').onSnapshot(s=>{L=s.docs.map(x=>({adv:[],susp:[],hist:[],auto:[],forcas:[],desenv:[],potenc:[],validar:[],disc:{D:0,I:0,S:0,C:0},...x.data()})).sort((a,b)=>a.nome.localeCompare(b.nome));loaded.l=true;if(loaded.c)renderAll()},fail);
  db.collection('conferir').onSnapshot(s=>{CF=s.docs.map(x=>({...x.data(),_id:x.id}));loaded.c=true;if(loaded.l)renderAll()},fail);
})();
</script>
