<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gratificação BPP e Produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: faixa institucional grafite com dourado de açúcar com abas; barra de filtros fixa (ano, mês, matrícula/nome); resumo antes do detalhe; ficha do colaborador em formato de documento; tudo clicável abre quem está por trás do número. */
:root{
  --bg:#f3f4f2;--card:#ffffff;--ink:#1f2328;--mut:#5d646e;--line:#e1e3e0;--trk:#ebedea;
  --hd1:#1c2026;--hd2:#3b424c;--hdink:#ffffff;
  --gold:#e0a33a;--gold-ink:#8a5a05;--gold-soft:#fbefd8;
  --pay:#1f7fa6;--pay-soft:#e2f0f6;--disc:#d0593a;--disc-ink:#a63d22;--disc-soft:#fbe8e2;
  --prev:#5b5f73;--prev-soft:#e6e8ef;--plum:#7a4b8c;--plum-soft:#f1e7f5;--gray:#9aa0a6;
  --shadow:0 1px 2px rgba(28,32,38,.05),0 6px 18px rgba(28,32,38,.08);
  --f-disp:"Archivo","Segoe UI",system-ui,sans-serif;--f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121416;--card:#1c1f23;--ink:#eceef0;--mut:#a3a9b1;--line:#30353b;--trk:#262a2f;
  --hd1:#14171b;--hd2:#2b3139;--hdink:#ffffff;
  --gold:#e8b24f;--gold-ink:#f0c46a;--gold-soft:#3a3018;
  --pay:#4fb0d6;--pay-soft:#183441;--disc:#e7795a;--disc-ink:#f29a80;--disc-soft:#43251c;
  --prev:#a3a8bf;--prev-soft:#2a2f3d;--plum:#b385c7;--plum-soft:#35263d;--gray:#6c737b;
  --shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121416;--card:#1c1f23;--ink:#eceef0;--mut:#a3a9b1;--line:#30353b;--trk:#262a2f;
  --hd1:#14171b;--hd2:#2b3139;--hdink:#ffffff;
  --gold:#e8b24f;--gold-ink:#f0c46a;--gold-soft:#3a3018;
  --pay:#4fb0d6;--pay-soft:#183441;--disc:#e7795a;--disc-ink:#f29a80;--disc-soft:#43251c;
  --prev:#a3a8bf;--prev-soft:#2a2f3d;--plum:#b385c7;--plum-soft:#35263d;--gray:#6c737b;
  --shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{background:linear-gradient(118deg,var(--hd1),var(--hd2));color:var(--hdink);border-bottom:4px solid var(--gold)}
.hin{max-width:1280px;margin:0 auto;padding:18px 16px 0;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;min-width:0;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:6px 10px;display:flex;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.logo img{height:44px;width:auto;display:block}
header h1{margin:0;font:700 22px/1.2 var(--f-disp);text-wrap:balance}
header small{display:block;font-size:13px;opacity:.85;margin-top:3px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;width:100%;margin-top:4px}
.tabs button{border:0;background:none;color:var(--hdink);padding:10px 16px;border-radius:9px 9px 0 0;font-weight:600;cursor:pointer;opacity:.85}
.tabs button:hover{background:rgba(255,255,255,.1);opacity:1}
.tabs button.on{background:var(--gold);color:#1c1503;opacity:1}
.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:rgba(255,255,255,.2);font-size:12px}
.tabs button.on .cnt{background:rgba(0,0,0,.15)}
main{max-width:1280px;margin:0 auto;padding-block:16px 40px;padding-inline:16px}
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:14px}
.fl{display:flex;align-items:center;gap:8px}
.fl label{font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.fl select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:100%}
.sbox{position:relative;flex:1 1 280px;min-width:0}
.sbox input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;z-index:9;max-height:340px;overflow-y:auto}
.sres button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer}
.sres button:hover,.sres button:focus-visible{background:var(--trk)}
.sres small{display:block;color:var(--mut);font-size:12px}
.clr{border:0;background:none;color:var(--hd2);font-weight:600;text-decoration:underline;cursor:pointer;padding:4px}
:root:not([data-theme="light"]) .clr{color:var(--gold-ink)}
.hero{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;box-shadow:var(--shadow);padding:16px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 22px;align-items:center;margin-bottom:14px}
.hero .big{font:800 46px/1 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--pay)}
.hero .big small{display:block;font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.hero p{margin:0;font-size:16.5px;max-width:82ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;text-align:left;cursor:pointer;display:block;width:100%;border-top:4px solid var(--k)}
.kpi:hover{border-color:var(--k)}
.kpi .l{display:block;font:700 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.kpi .v{display:block;font:800 clamp(18px,1.6vw,26px)/1.15 var(--f-disp);white-space:nowrap;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--k)}
.kpi .s{display:block;font-size:13px;color:var(--mut);margin-top:3px}
.kpi .go{display:block;font-size:12px;font-weight:700;margin-top:8px;color:var(--k)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card.full{grid-column:1/-1}
.card h2{font:700 17px var(--f-disp);margin:0 0 2px;text-wrap:balance}
.card .sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mut);margin-bottom:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cols{display:grid;gap:10px;align-items:end;height:230px;border-bottom:1px solid var(--line);padding-top:24px;background:repeating-linear-gradient(to top,transparent 0 45px,var(--trk) 45px 46px)}
.col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.col .t{font:700 13px var(--f-body);font-variant-numeric:tabular-nums;margin-bottom:4px;white-space:nowrap}
.col .stk{width:min(64px,80%);display:flex;flex-direction:column;border-radius:6px 6px 0 0;overflow:hidden}
.col .stk span{display:block}
.col.miss .stk{border:2px dashed var(--gray);border-bottom:0;background:repeating-linear-gradient(45deg,transparent 0 6px,var(--trk) 6px 12px)}
.col.dim{opacity:.35}
.col:hover .stk{filter:brightness(1.07)}
.xl{display:grid;gap:10px;margin-top:6px;text-align:center;font-size:12px;color:var(--mut);line-height:1.25}
.xl b{display:block;color:var(--ink)}
.rows{display:grid;gap:4px}
.row{display:grid;grid-template-columns:minmax(0,46%) minmax(40px,1fr) auto;gap:10px;align-items:center;border:0;background:none;padding:5px 4px;text-align:left;cursor:pointer;border-radius:6px;width:100%}
.row:hover{background:var(--trk)}
.row .n{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.row .n small{display:block;color:var(--mut);font-size:12px}
.trk{height:12px;background:var(--trk);border-radius:99px;overflow:hidden}
.trk span{display:block;height:100%;border-radius:99px}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.hscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.heat{border-collapse:separate;border-spacing:3px;min-width:640px}
.heat th{font:700 12px var(--f-body);color:var(--mut);padding:4px;text-align:center}
.heat th.a{text-align:left}
.heat td{padding:0;text-align:center}
.heat td.a{text-align:left;font-size:13.5px;padding-right:8px;white-space:nowrap}
.heat td.a button{border:0;background:none;padding:2px 0;cursor:pointer;text-align:left}
.heat td.a button:hover{text-decoration:underline}
.heat td.a small{color:var(--mut);margin-left:6px}
.cell{display:block;width:100%;min-width:58px;border:0;border-radius:6px;padding:8px 2px;font:700 12.5px var(--f-body);cursor:pointer}
.cell.full{background:var(--pay-soft);color:var(--pay)}
.cell.part{background:var(--disc-soft);color:var(--disc-ink)}
.cell.nl{background:transparent;color:var(--mut);font-weight:400;cursor:default}
.cell.miss{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--trk) 5px 10px);color:var(--mut);font-weight:400;cursor:default}
.cell .m{display:block;font-size:11px;font-weight:600;opacity:.85}
.cell.flag{box-shadow:inset 0 0 0 2px var(--gold)}
.hmkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin-bottom:10px;align-items:center}
.hmkey i{display:inline-block;width:20px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--hd2)}
.btn.pdf{background:var(--disc);border-color:var(--disc);color:#fff}
.btn.xls{background:var(--pay);border-color:var(--pay);color:#fff}
.btn:disabled{opacity:.55;cursor:wait}
.tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.tools .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--hd2);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--mut)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--hd2);width:16px;height:16px}
table.lt th{font:700 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
table.lt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
table.lt td.num,table.lt th.num{text-align:right;white-space:nowrap}
table.lt td.mot{min-width:220px;max-width:420px;overflow-wrap:anywhere}
table.lt tbody tr.go{cursor:pointer}
table.lt tbody tr.go:hover td{background:var(--trk)}
table.lt input[type=checkbox]{width:17px;height:17px;accent-color:var(--hd2);cursor:pointer}
.nm{font-weight:600}.sm{display:block;color:var(--mut);font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.full{background:var(--pay-soft);color:var(--pay)}
.pill.part{background:var(--disc-soft);color:var(--disc-ink)}
.pill.nl{background:var(--trk);color:var(--mut)}
.pill.prod{background:var(--prev-soft);color:var(--prev)}
.cell.prod{background:var(--prev-soft);color:var(--prev)}
.ym.prod{background:var(--prev-soft);border-color:var(--prev)}.ym.prod b{color:var(--prev)}
table.ext table.cmpt td{padding:4px 10px 4px 0;border:0;background:none;font-size:13.5px;vertical-align:baseline}table.ext table.cmpt td.num{padding-left:28px}table.ext table.cmpt tr.s td{border-top:1px solid var(--line)}table.ext table.cmpt tr.t td{border-top:2px solid var(--ink)}
table.cmpt{width:auto;min-width:min(420px,100%);margin-top:4px}table.cmpt td{padding:3px 10px 3px 0;border:0;font-size:13.5px}table.cmpt td.num{text-align:right;white-space:nowrap;padding-left:24px}table.cmpt .neg{color:var(--disc-ink)}table.cmpt tr.h td{font-weight:700;padding-top:8px}table.cmpt tr.s td{font-weight:700;border-top:1px solid var(--line)}table.cmpt tr.t td{font-weight:800;border-top:2px solid var(--ink);padding-top:6px}
.pill.flag{background:var(--gold-soft);color:var(--gold-ink)}
.pill.reg{background:var(--plum-soft);color:var(--plum)}
.nil{color:var(--mut);font-style:italic}
.wrap-t{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:10px}
/* ficha */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:4px}
.pc:hover{border-color:var(--hd2);box-shadow:var(--shadow)}
.pc b{font-weight:700;font-size:14.5px;line-height:1.25}
.pc .meta{color:var(--mut);font-size:12.5px}
.pc .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.shd{background:linear-gradient(118deg,var(--hd1),var(--hd2));color:#fff;border-bottom:4px solid var(--gold);padding:20px 22px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.av{flex:none;width:60px;height:60px;border-radius:50%;background:var(--gold);color:#1c1503;font:800 22px/60px var(--f-disp);text-align:center}
.sid{flex:1 1 260px;min-width:0}
.eyebrow{font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.14em;color:#f3cf7f}
.shd h2{font:800 24px/1.15 var(--f-disp);margin:4px 0;text-wrap:balance;overflow-wrap:anywhere}
.shd .fs{opacity:.88;font-size:14px}
.sact{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);color:#fff;padding:9px 14px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.sbtn:hover{background:rgba(255,255,255,.2)}
.sbtn.pdf{background:var(--disc);border-color:var(--disc)}
.sbtn.xls{background:var(--pay);border-color:var(--pay)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.strip div{background:var(--trk);padding:11px 22px;min-width:0}
.strip span,.mini span{display:block;font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:2px}
.strip b{font:700 14.5px var(--f-disp);overflow-wrap:anywhere}
.fsec{padding:18px 22px 0}
.fsec h3{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--gold-ink);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.fsec h3::after{content:"";flex:1;height:2px;background:var(--gold);opacity:.5}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mini div{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.mini b{font:800 23px var(--f-disp);font-variant-numeric:tabular-nums}
.tl{display:grid;gap:10px}
.mo{border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:168px minmax(0,1fr);overflow:hidden}
.mo .mh{padding:12px 14px;background:var(--trk);border-right:4px solid var(--c)}
.mo .mh b{display:block;font:800 17px var(--f-disp)}
.mo .mh small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.mo .mb{padding:12px 16px;min-width:0;display:grid;gap:8px}
.vals{display:flex;flex-wrap:wrap;gap:6px 22px;font-variant-numeric:tabular-nums}
.vals div>span:first-child{display:block;font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.vals div b{font-size:16px}
.just{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.just>span:first-child{display:block;font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:2px}
.regs{display:flex;flex-wrap:wrap;gap:6px}
.ffoot{padding:16px 22px 20px;color:var(--mut);font-size:12.5px}
.yr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.ym{border:1px solid var(--line);border-radius:10px;padding:8px 2px 7px;text-align:center;background:var(--card);cursor:pointer;display:grid;gap:1px;min-width:0}
.ym .mn{font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);position:relative}
.ym .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:4px;vertical-align:1px}
.ym b{font:800 16px/1.2 var(--f-disp);font-variant-numeric:tabular-nums}
.ym small{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.ym.full{background:var(--pay-soft);border-color:var(--pay)}.ym.full b{color:var(--pay)}
.ym.part{background:var(--disc-soft);border-color:var(--disc)}.ym.part b{color:var(--disc-ink)}
.ym.miss{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--trk) 5px 10px)}
.ym.off{opacity:.45;cursor:default;background:var(--bg)}
.ym.sel{outline:2px solid var(--gold);outline-offset:1px}
.ym:not(.off):hover{box-shadow:var(--shadow)}
table.ext{min-width:820px}
table.ext th{font:700 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
table.ext td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px;font-variant-numeric:tabular-nums}
table.ext .num{text-align:right;white-space:nowrap}
table.ext td.cp{border-left:4px solid var(--c);white-space:nowrap}
table.ext td.mot{min-width:240px;overflow-wrap:anywhere}
table.ext td.chev{color:var(--mut);width:28px;text-align:center}
table.ext tr.go{cursor:pointer}
table.ext tr.go:hover td,table.ext tr.op td{background:var(--trk)}
table.ext tr.xd>td{background:var(--bg);padding:12px 16px 14px 18px;border-left:4px solid var(--gold)}
.xdg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;font-size:14px}
.xdg>div>span:first-child{display:block;font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:3px}
table.ext tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0;padding-top:10px}
@media (max-width:760px){.yr{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cr-top .full-w{grid-column:1/-1}
.cr-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:14px}
.cr-crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cr-crit div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.cr-crit b{font:800 20px var(--f-disp);color:var(--disc-ink);font-variant-numeric:tabular-nums;flex:none}
.cr-crit span{font-weight:600;font-size:14.5px;line-height:1.25}
.cr-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cr-f span{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:800 17px var(--f-disp);text-align:center;min-width:86px}
.cr-f span small{display:block;font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:2px}
.cr-f span.ok{border-color:var(--pay);background:var(--pay-soft);color:var(--pay)}
.cr-f i{font-style:normal;font-weight:700;color:var(--mut)}
.cr-n{margin:12px 0 0;font-size:14.5px}
.cr-ex{margin-top:12px;background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:14.5px;font-variant-numeric:tabular-nums}
.cr-ex small{display:block;font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--gold-ink);margin-bottom:3px}
.cr-ms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cr-ms span{border-radius:10px;padding:6px 14px;font-weight:700;text-align:center;font-size:14px}
.cr-ms span small{display:block;font-size:11px;font-weight:600}
.cr-ms .ok{background:var(--pay-soft);color:var(--pay)}
.cr-ms .no{background:repeating-linear-gradient(45deg,var(--disc-soft) 0 6px,transparent 6px 12px);color:var(--disc-ink);box-shadow:inset 0 0 0 1px var(--disc)}
table.cr-t{min-width:680px}
table.cr-t th{font:700 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
table.cr-t td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
table.cr-t .num{text-align:right;white-space:nowrap}
table.cr-t tr.no td{background:var(--disc-soft)}
.cr-src{display:grid;gap:12px}
.cr-src div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:start}
.cr-src p{margin:0;font-size:14.5px}
.cr-src .pill{justify-self:start}
.cr-l{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14.5px}
@media (max-width:560px){.cr-crit{grid-template-columns:1fr}.cr-src div{grid-template-columns:1fr;gap:4px}}
/* conferir */
.cgrp{display:grid;gap:10px;margin-bottom:18px}
.cgrp h2{font:700 15px var(--f-disp);margin:4px 0}
.cf{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 16px;display:grid;gap:4px;text-align:left;cursor:pointer;width:100%}
.cf:hover{box-shadow:var(--shadow)}
.cf .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.cf b{font-size:15px}
.cf p{margin:0;font-size:14px;max-width:110ch}
.cf .ac{color:var(--mut);font-size:13.5px}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.crit ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.note{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.note b{color:var(--gold-ink)}
/* modal */
#ov{position:fixed;inset:0;z-index:30;background:rgba(16,18,22,.55);display:flex;justify-content:center;align-items:flex-start;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;overflow:auto}
.modal{background:var(--card);border-radius:16px;border-top:5px solid var(--gold);width:min(1100px,100%);padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mhd{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.mhd h2{font:800 20px/1.2 var(--f-disp);margin:0;text-wrap:balance}
.mhd p{margin:4px 0 0;color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:40;max-width:90vw}
.foot{color:var(--mut);font-size:12.5px;margin-top:18px;max-width:110ch}
@media (max-width:760px){
  .logo img{height:34px}header h1{font-size:19px}
  .hero{grid-template-columns:1fr}.hero .big{font-size:38px}
  .mo{grid-template-columns:1fr}.mo .mh{border-right:0;border-bottom:4px solid var(--c)}
  .shd,.fsec{padding-inline:16px}.strip div{padding-inline:16px}
  .cols{gap:4px}.xl{gap:4px;font-size:10.5px}.col .t{font-size:11px}
}
@media (prefers-reduced-motion:no-preference){.trk span,.col .stk span{transition:height .25s,width .25s}}
</style>

   </tbody></table></div></div></div>`;
  const el=$('v-geral');el.innerHTML=h;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const t=b.dataset.d;const x=t==='all'?rs:rs.filter(r=>r.st===t);drawer(t==='part'?'Lançamentos com desconto por ocorrência':t==='full'?'Lançamentos pagos integralmente':t==='prod'?'Produção ou itens de avaliação abaixo de 100% (sem desconto por ocorrência)':'Todos os lançamentos',per,t==='prod'?rs.filter(r=>r.dPr>0.004):x)});

function personSum(mat,ms){const rs=ms.map(m=>getR(m,mat)).filter(Boolean);return{rs,prev:rs.reduce((a,r)=>a+r.prev,0),pago:rs.reduce((a,r)=>a+r.pago,0),nd:rs.filter(r=>r.dOc>0.004).length}}

  <article class="sheet"><div class="shd"><div class="av">${esc(initials(p.nome))}</div><div class="sid"><div class="eyebrow">Ficha de gratificação BPP e Produção · ${S.mes?ymLabel(S.mes):S.ano}</div><h2>${esc(p.nome)}</h2><div class="fs">Matrícula ${esc(MT(mat))} · ${esc(p.fun)} · ${esc(p.area)}</div></div>
   <div class="sact"><button class="sbtn pdf" type="button" id="fP">Exportar PDF</button><button class="sbtn xls" type="button" id="fX">Exportar Excel</button></div></div>
   <div class="strip"><div><span>Matrícula${p.mats.length>1?'s no período':''}</span><b>${esc(MT(mat))}</b></div><div><span>Função</span><b>${esc(p.fun)}</b></div><div><span>Setor</span><b>${esc(p.setor||p.dep)}</b></div><div><span>Admissão</span><b>${p.adm?dbr(p.adm):'não informada'}</b></div><div><span>Contrato</span><b>${esc(p.con||'não informado')}</b></div><div><span>Situação</span><b>${esc(p.sit)}${p.desl?' em '+dbr(p.desl)+(p.deslMot?' ('+esc(p.deslMot)+')':''):''}</b></div>${nomeP&&nomeP!==p.nome?`<div><span>Nome na planilha</span><b>${esc(nomeP)}</b></div>`:''}${p.proc?`<div style="grid-column:1/-1;background:var(--disc-soft)"><span style="color:var(--disc-ink)">Processo trabalhista</span><b style="color:var(--disc-ink)">${p.proc.map(x=>'nº '+esc(x[0])+' – '+esc(x[2])+' ('+esc(x[1])+')').join(' · ')}</b></div>`:''}${(p.vinc||[]).length?`<div style="grid-column:1/-1"><span>Vínculos (matrícula, admissão e desligamento)</span><b style="font-weight:600;font-size:14px">${vincTxt(p).map(esc).join('<br>')}</b></div>`:''}</div>
   <div class="fsec"><h3>Resumo ${S.mes?'do mês':'do ano'}</h3><div class="mini"><div><span>Previsto</span><b style="color:var(--prev)">${brl(s.prev)}</b></div><div><span>Pago</span><b style="color:var(--pay)">${brl(s.pago)}</b></div><div><span>Descontado</span><b style="color:var(--disc-ink)">${brl(s.rs.reduce((a,r)=>a+Math.max(0,r.desc),0))}</b>${s.rs.some(r=>r.desc<-0.004)?`<small style="display:block;color:var(--mut);font-size:12px">+ ${brl(s.rs.reduce((a,r)=>a+Math.max(0,-r.desc),0))} pagos acima do previsto</small>`:''}</div><div><span>Meses com desconto</span><b>${s.nd} de ${s.rs.length}</b></div></div></div>

  el.innerHTML=h;

  el.querySelectorAll('tr.x[data-x]').forEach(tr=>tr.onclick=()=>{const m=tr.dataset.x;S.open.has(m)?S.open.delete(m):S.open.add(m);renderFicha()});
  el.querySelectorAll('.ym[data-ym]').forEach(b=>b.onclick=()=>{const m=b.dataset.ym;if(!ms.includes(m)){S.mes='';}S.open.add(m);render();const r=document.querySelector('tr[data-x="'+m+'"],tr[data-xm="'+m+'"]');if(r)r.scrollIntoView({block:'center',behavior:'smooth'})});

function yearStrip(mat){const rng=monthsOfYear(S.ano);
  return`<div class="yr">${[...Array(12)].map((_,i)=>{const m=S.ano+'-'+String(i+1).padStart(2,'0');const c=cmp(m,areaOf(mat,m)),r=getR(m,mat);
    let cls,big,sm;if(r){cls=r.st;big=pct(r.pct);sm=brl(r.pago)}else if(c){cls='nl';big='—';sm='não consta'}else if(rng.includes(m)){cls='miss';big='—';sm='sem planilha'}else{cls='off';big='·';sm='sem dados'}
    const fl=r&&flagsOf(mat,m).length;
    return`<button type="button" class="ym ${cls}${S.mes===m?' sel':''}" ${cls==='off'?'disabled':`data-ym="${m}"`} title="${esc(ymLabel(m)+(r?': '+brl(r.pago)+' de '+brl(r.prev):''))}"><span class="mn">${MES[i].slice(0,3)}${fl?'<i class="dot"></i>':''}</span><b>${big}</b><small>${sm}</small></button>`}).join('')}</div>`}
function extrato(mat,ms){let tp=0,tg=0,td=0;
  const rows=ms.map(m=>{const c=cmp(m,areaOf(mat,m)),r=getR(m,mat),obs=obsOf(mat,m),regs=regsIn(mat,m),fl=flagsOf(mat,m);

  return`<div class="hscroll"><table class="ext"><thead><tr><th>Competência</th><th>Período apurado</th><th class="num">Previsto</th><th class="num">% do previsto</th><th class="num">Diferença</th><th class="num">Valor pago</th><th>Motivo / composição</th><th></th></tr></thead><tbody>${rows}</tbody>
   <tfoot><tr><td colspan="2">Total</td><td class="num">${brl(tp)}</td><td></td><td class="num" style="color:var(--disc-ink)">${td>0.004?'− '+brl(td):td<-0.004?'+ '+brl(-td):'—'}</td><td class="num">${brl(tg)}</td><td colspan="2"></td></tr></tfoot></table></div>
   <p class="sub" style="margin:8px 0 0;font-size:12.5px;color:var(--mut)">Clique na linha para ver cálculo, observações e registros do RH do mês.</p>`}
function monthBlock(mat,m){
  const c=cmp(m,areaOf(mat,m)),r=getR(m,mat),regs=regsIn(mat,m),obs=obsOf(mat,m);
  if(!c)return`<div class="mo" style="--c:var(--gray)"><div class="mh"><b>${ymLabel(m)}</b><small>sem planilha</small></div><div class="mb"><span class="nil">Planilha desta competência não foi enviada ao painel.</span></div></div>`;

function sheetFrom(aoa,widths,numCols,pctCols,startRow){const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=widths.map(w=>({wch:w}));
  const rg=XLSX.utils.decode_range(ws['!ref']);for(let R0=startRow;R0<=rg.e.r;R0++){numCols.forEach(c=>{const a=XLSX.utils.encode_cell({r:R0,c});if(ws[a]&&typeof ws[a].v==='number')ws[a].z='#,##0.00'});pctCols.forEach(c=>{const a=XLSX.utils.encode_cell({r:R0,c});if(ws[a]&&typeof ws[a].v==='number')ws[a].z='0.00%'})}return ws}

const OCK=['fic','fal','ate','adv','sus'];
const lrow=r=>{const b=[ymLabel(r.ym),r.area,cmp(r.ym,r.area).per,r.matr,r.nome,r.nomeP,r.fun,r.prev,r.pct,r.desc,r.pago,r.dias,r.mot||motOf(r),obsOf(r.mat,r.ym).join(' '),flagsOf(r.mat,r.ym).map(f=>f.t).join('; ')];
  if(r.kind==='op'){const c=r.cp;return b.concat(Array(17).fill(''),[c.g,c.aba,c.b100,c.bpp,c.p100,c.pp,c.t100,c.tp,c.compl])}
  if(r.kind!=='prod')return b;const c=r.cp;const g=k=>{const o=c.oc.find(o=>o[0]===k);return o?[o[2],o[3]]:[0,0]};return b.concat([c.base],...OCK.map(g),[c.bpp,c.p40,c.idx,c.pa,c.dd,c.pp])};
const LW=[15,16,26,10,38,34,18,14,11,12,14,9,48,30,40,12,8,12,8,12,8,12,8,12,8,12,12,12,10,12,12,12,24,22,12,12,12,12,12,12,12];
function xlsLanc(rows,title){if(!xlsOk())return;if(!rows.length){toast('Nenhum lançamento para exportar.');return}
  const aoa=[['CRV Industrial – Gratificação BPP e Produção · '+depTxt()+' · '+title],[fonteTxt()+' · Emitido em '+stamp()],[],LH,...rows.map(lrow)];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheetFrom(aoa,LW,[7,9,10,15,17,19,21,23,25,26,27,29,30,31,34,35,36,37,38,39,40],[8,28],4),'Lançamentos');
  save('Gratificacao_BPP_Producao_'+slug(title)+'_'+fstamp()+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
function xlsFichas(mats0){if(!xlsOk())return;const ms=S.mes?[S.mes]:monthsOfYear(S.ano);const mats=mats0.filter(m=>ms.some(x=>getR(x,m)));if(!mats.length){toast('Nenhum lançamento deste colaborador no período escolhido.');return}const wb=XLSX.utils.book_new();
  const all=[];
  const res=[['Matrícula','Colaborador','Função','Admissão','Contrato','Situação','Total previsto (R$)','Total pago (R$)','Total descontado (R$)','Meses avaliados','Meses com desconto']];
  mats.forEach(mat=>{const p=P[mat],s=personSum(mat,ms);res.push([MT(mat),p.nome,p.fun,dbr(p.adm),p.con,p.sit+(p.desl?' em '+dbr(p.desl):''),s.prev,s.pago,s.prev-s.pago,s.rs.length,s.nd]);
    ms.forEach(m=>{const r=getR(m,mat);if(r)all.push(lrow(r))})});
  XLSX.utils.book_append_sheet(wb,sheetFrom([['Resumo por colaborador – '+(S.mes?ymLabel(S.mes):S.ano)],[fonteTxt()+' · Emitido em '+stamp()],[],...res],[10,38,18,11,10,22,16,14,16,10,12],[6,7,8],[],4),'Resumo');
  XLSX.utils.book_append_sheet(wb,sheetFrom([['Histórico mês a mês'],[fonteTxt()],[],LH,...all],LW,[7,9,10,15,17,19,21,23,25,26,27,29,30,31,34,35,36,37,38,39,40],[8,28],4),'Histórico mês a mês');
  if(S.opt.regs){const rg=[['Matrícula','Colaborador','Competência','Data','Tipo','Painel','Descrição']];mats.forEach(mat=>ms.forEach(m=>regsIn(mat,m).forEach(g=>rg.push([MT(mat),P[mat].nome,ymLabel(m),dbr(g.d),g.t,g.src,g.txt]))));XLSX.utils.book_append_sheet(wb,sheetFrom(rg,[10,38,15,11,12,12,60],[],[],1),'Registros outros painéis')}
  save((mats.length===1?'Ficha_Gratificacao_BPP_Producao_'+MT1(mats[0])+'_'+slug(P[mats[0]].nome):'Fichas_Gratificacao_BPP_Producao_'+slug(depTxt()))+'_'+fstamp()+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
function xlsConf(fl){if(!xlsOk())return;const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,sheetFrom([['Tipo','Competência','Matrícula','Colaborador','Ponto','Detalhe','O que fazer'],...fl.map(f=>[f.g,ymLabel(f.ym),f.mat?MT(f.mat):(f.lst?f.lst.length+' lançamentos':''),f.mat?P[f.mat].nome:(f.area||''),f.t,f.d,f.a])],[14,15,10,36,36,80,60],[],[],1),'A conferir');
  save('Gratificacao_BPP_Producao_A_conferir_'+fstamp()+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}

/* ---------- render ---------- */
function render(){renderTabs();renderFilters();
  ['geral','ficha','lanc','conf','crit'].forEach(k=>$('v-'+k).hidden=S.tab!==k);
  ({geral:renderGeral,ficha:renderFicha,lanc:renderLanc,conf:renderConf,crit:renderCrit})[S.tab]();
  $('foot').textContent='Base: '+[...new Set(DATA.comps.map(c=>c.kind==='dem'?'26 competências em planilhas mensais "Gratificação BPP - Apuração" da Oficina (nov/2021 a mai/2024)':'"'+c.arq+'"'))].join(', ')+'; competências '+AREAS.map(a=>{const y=DATA.comps.filter(c=>c.area===a).map(c=>c.ym).sort();return a+' '+ymShort(y[0])+' a '+ymShort(y[y.length-1])}).join('; ')+', '+R.length+' lançamentos. Cadastro cruzado pela matrícula, nome e CPF com a base de ativos e demitidos da CRV (06/10/2026), a base das empresas 6 e 16 e a Base Geral (30/09/2026). Para incluir um novo mês ou outro setor, envie a planilha e o painel é atualizado mantendo o histórico.';
}
render();
</script>
