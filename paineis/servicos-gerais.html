<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serviços Gerais · Horas extras e gratificação</title>
<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#1f2430;--mut:#66707f;--line:#e5e3df;--trk:#efede9;
 --pet:#24414f;--pet2:#16303c;--ter:#c0582f;--terbg:#fbeee7;--amb:#c98a17;--ambbg:#fcf3dd;--tea:#1f7f86;--teabg:#e3f2f3;--plu:#7a4f8f;--plubg:#f2ebf6;
 --ok:#2f7a55;--okbg:#e5f2eb;--bad:#b42318;--badbg:#fdecea}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(115deg,var(--pet2),var(--pet) 60%,#3b4e44);color:#fff;position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--ter),var(--amb),var(--tea))}
.hin{max-width:1280px;margin:0 auto;padding:16px 18px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:6px 10px;display:flex}.logo img{height:40px;display:block}
.ttl{flex:1;min-width:240px}.ttl .eb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.ttl h1{margin:2px 0 0;font-size:21px}.ttl small{display:block;opacity:.85;font-size:12.5px;margin-top:2px}
.comp{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 10px}
.comp label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.comp .nav{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:7px;width:28px;height:28px;font-size:18px;line-height:1;cursor:pointer}.comp .nav:hover{background:rgba(255,255,255,.3)}
.comp select{font:inherit;font-weight:700;border:0;border-radius:7px;padding:5px 8px;background:#fff;color:var(--pet2)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 13px;font:600 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c9c4bb}.btn.pri{background:var(--ter);border-color:var(--ter);color:#fff}.btn.pri:hover{background:#a84a26}
.btn.tea{background:var(--tea);border-color:var(--tea);color:#fff}.btn.sm{padding:4px 9px;font-size:12px}.btn.perigo{color:var(--bad);border-color:#efc2bb}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1280px;margin:0 auto;padding:16px 18px 40px}
.vtabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vtabs button{border:0;background:none;padding:9px 15px;font:600 14px inherit;font-family:inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.vtabs button.on{color:var(--pet2);border-bottom-color:var(--ter)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:4px solid var(--c,var(--ter));text-align:left;font:inherit;color:inherit;cursor:pointer}
.kpi:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}.kpi .v{font-size:25px;font-weight:750;line-height:1.15;margin-top:2px}.kpi .s{font-size:12px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.box h2{margin:0 0 2px;font-size:16px}.box .sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.tools .esp{flex:1}
.tools input[type=search]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:220px;flex:1;max-width:360px}
.tab{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#faf9f7;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid var(--trk);vertical-align:top}tr.go{cursor:pointer}tr.go:hover td{background:#faf7f2}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td.c,th.c{text-align:center}
tfoot td{font-weight:700;background:#faf7f2;border-top:1px solid var(--line)}
.mut{color:var(--mut)}.small{font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ter{background:var(--terbg);color:#8a3a1a}.p-amb{background:var(--ambbg);color:#7a5200}.p-tea{background:var(--teabg);color:#14595e}.p-plu{background:var(--plubg);color:#5a3570}.p-ok{background:var(--okbg);color:#1d5c3a}.p-bad{background:var(--badbg);color:#8a2a1a}
.av{background:var(--ambbg);border:1px solid #efd9a4;color:#6b4a00;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.av.in{background:#eef3f5;border-color:#d3e0e5;color:#24414f}
.bars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(120px,210px) 1fr 90px;gap:10px;align-items:center;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:3px 4px;border-radius:7px;cursor:pointer}
.hb:hover{background:#f7f4ef}.hb .t{height:14px;background:var(--trk);border-radius:99px;overflow:hidden;display:flex}.hb .t i{display:block;height:100%}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.hb .v{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding:6px 4px 0;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;border:0;background:none;font:inherit;cursor:pointer;color:inherit;padding:0}
.col .b{width:100%;max-width:46px;border-radius:6px 6px 0 0;min-height:2px}.col small{font-size:11.5px;color:var(--mut)}.col b{font-size:12px}
.col.on .b{outline:2px solid var(--pet2);outline-offset:1px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* janelas */
.fundo{position:fixed;inset:0;background:rgba(20,26,34,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:22px 12px;overflow:auto}
.jan{background:#fff;border-radius:14px;width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.jan.st{width:min(620px,100%)}
.jcab{display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}.jcab h3{margin:0;flex:1;font-size:16px}.jcab small{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}
.jcorpo{padding:14px 18px}.jpe{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}.jpe .esp{flex:1;font-size:13px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mut)}
.fg{display:grid;grid-template-columns:repeat(12,1fr);gap:10px 12px}
.fc{display:flex;flex-direction:column;gap:4px}.fc label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.fc input,.fc select,.fc textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;background:#fbfaf8;color:var(--ink)}
.fc textarea{min-height:64px;resize:vertical}
.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}.w5{grid-column:span 5}.w6{grid-column:span 6}.w8{grid-column:span 8}.w12{grid-column:span 12}
.pes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fbfaf8}
.pes label{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer;padding:3px 4px;border-radius:6px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}.pes label:hover{background:#f1eee8}
.lin input{width:96px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px}
.lin td{vertical-align:middle}
.msg{font-size:13px}.msg.er{color:var(--bad)}.msg.ok{color:var(--ok)}
/* gratificação */
.gt td{vertical-align:middle}.gt input[type=number],.gt input.tx{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px;background:#fff}
.gt input[type=number]{width:62px;text-align:right}.gt input.tx{width:100%;min-width:150px}.gt td:nth-child(2){min-width:190px}.gt td:nth-child(4){min-width:300px}.gt .crit label{padding:2px 5px}
.crit{display:flex;gap:4px;flex-wrap:wrap}.crit label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:2px 6px;font-size:11.5px;cursor:pointer;white-space:nowrap;background:#fff}
.crit label.on{background:var(--terbg);border-color:#e9b9a3;color:#8a3a1a;font-weight:700}.crit label.au{background:var(--plubg);border-color:#cdb4dc;color:#5a3570;font-weight:700}.crit label.ig{background:#f4f3f1;border-style:dashed;color:#9aa0aa;text-decoration:line-through}.crit label small{font-weight:400;opacity:.85}
.sug{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.sug span{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--plubg);color:#5a3570}
.pct{font-weight:750;font-variant-numeric:tabular-nums}.pct.b{color:var(--bad)}
.salvo{font-size:12.5px;color:var(--mut)}
.foot{color:var(--mut);font-size:12px;margin-top:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:80}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.w2,.w3,.w4,.w5,.w6,.w8{grid-column:span 12}.hb{grid-template-columns:120px 1fr 70px}}
</style>
</head>
<body>
<header><div class="hin">
  <span class="logo"><img alt="CRV Industrial" src="__CRV_BASE__img/logo-crv.png"></span>
  <div class="ttl"><div class="eb">Gestão de Pessoas · Serviços Gerais</div><h1>Horas extras e Gratificação BPP</h1><small id="sub"></small></div>
  <div class="comp"><button class="nav" id="mAnt" title="Mês anterior">‹</button><label for="selComp">Mês</label><select id="selComp"></select><button class="nav" id="mProx" title="Próximo mês">›</button></div>
</div></header>
<main>
  <nav class="vtabs" id="vtabs"><button data-v="g" class="on">Visão geral</button><button data-v="h">Horas extras</button><button data-v="b">Gratificação BPP</button><button data-v="m">Mês a mês</button><button data-v="c">Por colaborador</button><button data-v="cfg">Regras, assinaturas e textos</button></nav>
  <section id="vG"></section>
  <section id="vH" hidden></section>
  <section id="vB" hidden></section>
  <section id="vM" hidden></section>
  <section id="vC" hidden></section>
  <section id="vCfg" hidden></section>
  <p class="foot" id="foot"></p>
</main>
<div class="toast" id="toast" hidden></div>
<script>/*__CRV_DADOS_0__*/</script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const brl=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=v=>(+v||0).toLocaleString('pt-BR');
const tc=s=>String(s||'').toLowerCase().replace(/(^|[\s\/(.-])(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/ (Da|De|Do|Dos|Das|E) /g,m=>m.toLowerCase());
const hm=m=>m==null||isNaN(m)?'':Math.floor(m/60)+':'+String(Math.round(m%60)).padStart(2,'0');
const hmT=m=>m==null||isNaN(m)?'':String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0');
const toMin=s=>{const m=String(s||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const compNome=c=>c?MESES[+c.slice(5,7)-1]+'/'+c.slice(0,4):'';
const compCap=c=>{const t=compNome(c);return t.charAt(0).toUpperCase()+t.slice(1)};
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addMes=(c,n)=>{let y=+c.slice(0,4),m=+c.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const addDia=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}
const quem=()=>(window.parent&&window.parent.CRV_QUEM)||'';
const P0=(typeof SG!=='undefined'&&SG)||{he:[],heMes:{},grat:{},cfg:{}};

/* ---------- banco ---------- */
let DB=null;const db=async()=>{if(DB)return DB;try{DB=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(_){DB=null}return DB};
let HE_DB={},GR_DB={},HM_DB={},CFG_DB=null,QD={};
async function carregar(){
  const D=await db();
  if(D){try{const [a,b,c,d]=await Promise.all([D.collection('he').get(),D.collection('grat').get(),D.collection('heMes').get(),D.collection('cfg').get()]);
    HE_DB={};a.docs.forEach(x=>HE_DB[x.id]=x.data());GR_DB={};b.docs.forEach(x=>GR_DB[x.id]=x.data());HM_DB={};c.docs.forEach(x=>HM_DB[x.id]=x.data());
    const g=d.docs.find(x=>x.id==='geral');CFG_DB=g?g.data():null}catch(e){console.warn(e)}}
  try{const f=window.parent&&window.parent.CRV_QUADRO;if(typeof f==='function'){const q=await f();QD=(q&&q.mapa)||{}}}catch(_){}
}
const CFG=()=>Object.assign({setor:'Serviços Gerais',cidade:'Capinópolis - MG',assHE:[],assGR:[],criterios:['Não uso do EPI','Comportamento','Atestado','Falta sem justificativa'],pesoCrit:.25},P0.cfg||{},CFG_DB||{});
/* horas extras: pacote (histórico) + app; um registro do app com o mesmo id substitui o do pacote */
function HE(){const m={};(P0.he||[]).forEach(x=>m[x.id]=Object.assign({fonte:'hist'},x));Object.entries(HE_DB).forEach(([id,x])=>m[id]=Object.assign({},m[id]||{},x,{id,fonte:'app'}));
  return Object.values(m).filter(x=>!x.excluida).map(x=>{const c=x.ini!=null&&x.fim!=null?((x.fim-x.ini)%1440+1440)%1440-(+x.intervalo||0):null;x.calc=c;x.min=x.qtd!=null?x.qtd:c;return x})}
function GR(c){return GR_DB[c]||(P0.grat||{})[c]||null}
function comps(){const s=new Set([...Object.keys(P0.grat||{}),...Object.keys(GR_DB),...HE().map(x=>x.comp)]);const h=hoje().slice(0,7);s.add(h);s.add(addMes(h,-1));const mx=[...s].filter(Boolean).sort().pop();s.add(addMes(mx,1));s.add(addMes(mx,2));EXTRA.forEach(c=>s.add(c));return [...s].filter(Boolean).sort()}
const EXTRA=new Set();
let COMP='',V='g';
/* pessoa pelo Quadro */
const pessoa=m=>{const q=QD[String(m)];return q?{nome:q.nome,funcao:q.funcao,adm:q.admissao,sit:q.situacao,ccd:q.ccd||'',setor:q.setor}:null};
/* equipe: quem está na última gratificação + quem teve hora extra; sugestões da mesma seção no Quadro */
function equipe(){const m={};const cs=Object.keys(Object.assign({},P0.grat,GR_DB)).sort();const ult=cs.length?GR(cs[cs.length-1]):null;
  (ult&&ult.itens||[]).forEach(i=>m[i.mat]={mat:i.mat,nome:i.nome,funcao:i.funcao,prev:i.prev});
  HE().forEach(x=>{if(!m[x.mat])m[x.mat]={mat:x.mat,nome:x.nome,funcao:x.funcao}});
  Object.values(m).forEach(p=>{const q=pessoa(p.mat);if(q){p.nome=q.nome;p.funcao=q.funcao;p.sit=q.sit;p.adm=q.adm}});
  return Object.values(m).sort((a,b)=>a.nome.localeCompare(b.nome))}
function daSecao(){const e=new Set(equipe().map(p=>p.mat));const sec=new Set();equipe().forEach(p=>{const q=QD[p.mat];if(q&&q.ccd)sec.add(q.ccd)});
  return Object.entries(QD).filter(([m,q])=>q.situacao!=='Desligado'&&sec.has(q.ccd)&&!e.has(m)).map(([m,q])=>({mat:m,nome:q.nome,funcao:q.funcao})).sort((a,b)=>a.nome.localeCompare(b.nome))}

/* ---------- topo ---------- */
function topo(){if(COMP)EXTRA.add(COMP);const cs=comps();if(!COMP||!cs.includes(COMP)){const g=Object.keys(Object.assign({},P0.grat,GR_DB)).sort();COMP=cs.includes(hoje().slice(0,7))&&(HE().some(x=>x.comp===hoje().slice(0,7))||GR(hoje().slice(0,7)))?hoje().slice(0,7):(g[g.length-1]||cs[cs.length-1])}
  $('selComp').innerHTML=cs.slice().reverse().map(c=>'<option value="'+c+'"'+(c===COMP?' selected':'')+'>'+compCap(c)+'</option>').join('');
  $('sub').textContent=CFG().setor+' · lançamentos mensais de horas extras e da avaliação BPP';
  $('foot').textContent='Histórico: '+(P0.origem||'planilhas do setor')+'. Lançamentos novos são digitados aqui no app. Nome, função e admissão vêm do Quadro pela matrícula.';}
$('selComp').onchange=()=>{COMP=$('selComp').value;render()};
const irMes=n=>{COMP=addMes(COMP,n);EXTRA.add(COMP);render()};$('mAnt').onclick=()=>irMes(-1);$('mProx').onclick=()=>irMes(1);
$('vtabs').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;V=b.dataset.v;render()};
function render(){topo();document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===V));
  [['g','vG'],['h','vH'],['b','vB'],['m','vM'],['c','vC'],['cfg','vCfg']].forEach(([k,id])=>$(id).hidden=V!==k);
  if(V==='g')rGeral();if(V==='h')rHE();if(V==='b')rGR();if(V==='m')rMes();if(V==='c')rCol();if(V==='cfg')rCfg()}

/* ---------- cálculo da gratificação ----------
   Regras (editáveis em "Assinaturas e textos"): cada ocorrência tira o seu percentual; "uma vez" conta uma vez no período, "por ocorrência" multiplica.
   Atestado, falta, advertência e suspensão vêm sozinhos do Absenteísmo e das Sanções; mau comportamento e EPI são marcados à mão.
   Férias no período: proporcional aos dias trabalhados (base 30). */
const REGRAS0=[{k:'mc',nome:'Mau comportamento',peso:.5,modo:'uma'},{k:'epi',nome:'Não uso do EPI',peso:.25,modo:'uma'},{k:'at',nome:'Atestado',peso:.25,modo:'uma',auto:1},{k:'fa',nome:'Falta sem justificativa',peso:.25,modo:'uma',auto:1},{k:'adv',nome:'Advertência',peso:.25,modo:'uma',auto:1},{k:'su',nome:'Suspensão',peso:.5,modo:'uma',auto:1}];
const REGRAS=()=>{const r=(CFG_DB&&Array.isArray(CFG_DB.regras)&&CFG_DB.regras.length)?CFG_DB.regras:REGRAS0;return r.map(x=>Object.assign({},REGRAS0.find(y=>y.k===x.k)||{},x))};
const NOMEK={'comportamento':'mc','mau comportamento':'mc','não uso do epi':'epi','nao uso do epi':'epi','atestado':'at','falta sem justificativa':'fa','falta':'fa','advertência':'adv','advertencia':'adv','suspensão':'su','suspensao':'su'};
const kDe=c=>REGRAS().some(r=>r.k===c)?c:(NOMEK[String(c).toLowerCase()]||c);
const histItem=i=>!i.crit&&i.pct!=null&&!i.au;
function aplicadas(i){const R=REGRAS(),man=new Set((i.crit||[]).map(kDe)),ign=new Set(i.ign||[]),au=i.au||{};
  return R.filter(r=>man.has(r.k)||(au[r.k]&&!ign.has(r.k))).map(r=>({r,n:man.has(r.k)&&!au[r.k]?1:Math.max(1,(au[r.k]||{}).n||1),txt:(au[r.k]||{}).txt||'',auto:!!(au[r.k]&&!ign.has(r.k))}))}

    try{await D.collection('cfg').doc('geral').set(Object.assign({},CFG_DB||{},nc));CFG_DB=Object.assign({},CFG_DB||{},nc);
      const hmx={emissao:$('cEm').value,texto:$('cTx').value.trim()};await D.collection('heMes').doc(COMP).set(hmx);HM_DB[COMP]=hmx;m.className='msg ok';m.textContent='Salvo.';topo()}catch(e){m.className='msg er';m.textContent='Não consegui salvar: '+(e.message||'sem permissão')}}}

/* ---------- textos e arquivos ---------- */
function textoHE(c,auto){const hm0=HM_DB[c]||{};if(!auto&&hm0.texto)return hm0.texto;const L=HE().filter(x=>x.comp===c);const ds=[...new Set(L.map(x=>x.data))].sort();
  const ms=[...new Set(ds.map(d=>d.slice(0,7)))].map(m=>MESES[+m.slice(5)-1]+'/'+m.slice(0,4));
  const porMes={};ds.forEach(d=>{(porMes[d.slice(0,7)]=porMes[d.slice(0,7)]||[]).push(d)});
  const dias=Object.values(porMes).map(a=>a.map(d=>d.slice(8)).join(', ')+'/'+a[0].slice(5,7)+'/'+a[0].slice(0,4)).join(' e ');
  return 'Solicitamos o pagamento das horas extras abaixo relacionadas, referentes aos serviços prestados pelos colaboradores do setor '+CFG().setor.replace(/^.*- */,'')+', realizadas no período de '+(ms.join(' e ')||compNome(c))+', em razão de atividades executadas após a jornada de trabalho'+(ds.length?' nos dias '+dias:'')+'.'}
function dataExtenso(iso){const d=iso||hoje();return CFG().cidade+', '+(+d.slice(8))+' de '+MESES[+d.slice(5,7)-1]+' de '+d.slice(0,4)}
const JS=()=>(window.jspdf&&window.jspdf.jsPDF)||(window.parent&&window.parent.jspdf&&window.parent.jspdf.jsPDF);
const XL=()=>window.XLSX||(window.parent&&window.parent.XLSX);
async function salvarArq(nome,bytes,tipo){const DL=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;if(DL)return DL.save({filename:nome,data:bytes});
  const u=URL.createObjectURL(new Blob([bytes],{type:tipo}));const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
const logos=doc=>(window.parent.CRV_PDF_LOGOS||window.CRV_PDF_LOGOS||(d=>d))(doc);
function assinaturas(doc,lista,y,W){const n=lista.length;if(!n)return y;const H=doc.internal.pageSize.getHeight();if(y>H-40){doc.addPage();y=30}
  const por=Math.min(3,n),lw=Math.min(70,(W-20-(por-1)*12)/por);let row=0;
  for(let i=0;i<n;i+=por){const g=lista.slice(i,i+por),tw=g.length*lw+(g.length-1)*12;let x=(W-tw)/2;const yy=y+row*26+14;
    g.forEach(a=>{doc.setDrawColor(60,66,80);doc.setLineWidth(.3);doc.line(x,yy,x+lw,yy);doc.setFont('helvetica','bold');doc.setFontSize(8.8);doc.setTextColor(30,36,48);doc.text(String(a.nome||''),x+lw/2,yy+4.5,{align:'center'});doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(90,96,110);doc.text(String(a.cargo||''),x+lw/2,yy+8.6,{align:'center'});x+=lw+12});row++}
  return y+row*26+10}
function cabPDF(doc,t1,t2,W){doc.setFillColor(36,65,79);doc.rect(0,0,W,2.2,'F');doc.setFillColor(192,88,47);doc.rect(0,2.2,W,.9,'F');doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(22,48,60);doc.text(t1,10,12);doc.setFont('helvetica','normal');doc.setFontSize(8.8);doc.setTextColor(70,76,88);doc.text(t2,10,17.5)}
/* horas extras: Excel e PDF */
function linhasHE(){return HE().filter(x=>x.comp===COMP).sort((a,b)=>a.data.localeCompare(b.data)||a.nome.localeCompare(b.nome)).map(x=>{const p=pessoa(x.mat)||{};return Object.assign({},x,{nome:p.nome||x.nome,funcao:p.funcao||x.funcao,adm:p.adm||x.adm})})}
async function xlsHE(){const X=XL();if(!X)throw new Error('Excel indisponível.');const L=linhasHE();if(!L.length)throw new Error('Nenhuma hora extra lançada neste mês.');
  const a=[['CRV INDUSTRIAL · Solicitação de pagamento de horas extras'],[dataExtenso((HM_DB[COMP]||{}).emissao||(P0.heMes&&P0.heMes[COMP]||{}).emissao)],[textoHE(COMP)],['SETOR: '+CFG().setor],[],['DATA','MAT.','COLABORADOR','FUNÇÃO','ADMISSÃO','MOTIVO','HORA INICIAL','HORA FINAL','QUANT. HORAS']];
  L.forEach(x=>a.push([br(x.data),+x.mat,x.nome,x.funcao,br(x.adm),x.motivo,hmT(x.ini),hmT(x.fim),hm(x.min)]));
  const tot=L.reduce((s,x)=>s+(x.min||0),0);a.push(['TOTAL',null,null,null,null,null,null,null,hm(tot)]);a.push([]);a.push(['TOTAL POR COLABORADOR']);a.push(['MAT.','COLABORADOR','QUANT. HORAS']);
  const pm={};L.forEach(x=>{pm[x.mat]=pm[x.mat]||{n:x.nome,v:0};pm[x.mat].v+=x.min||0});Object.entries(pm).sort((p,q)=>p[1].n.localeCompare(q[1].n)).forEach(([m,p])=>a.push([+m,p.n,hm(p.v)]));
  const ws=X.utils.aoa_to_sheet(a);ws['!cols']=[11,8,38,18,11,30,12,11,13].map(w=>({wch:w}));const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Horas extras');
  await salvarArq('Horas extras Servicos Gerais - '+compCap(COMP).replace('/',' ')+'.xlsx',new Uint8Array(X.write(wb,{bookType:'xlsx',type:'array'})),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
async function pdfHE(){const J=JS();if(!J)throw new Error('PDF indisponível.');const L=linhasHE();if(!L.length)throw new Error('Nenhuma hora extra lançada neste mês.');
  const doc=new J({unit:'mm',format:'a4'}),W=210;const em=(HM_DB[COMP]||{}).emissao||(P0.heMes&&P0.heMes[COMP]||{}).emissao||hoje();

    foot:[['Total','','','','','','','',hm(tot)]],showFoot:'lastPage',styles:{fontSize:7.6,cellPadding:1.2,lineColor:[225,222,216],lineWidth:.1},headStyles:{fillColor:[36,65,79],fontSize:7.6},footStyles:{fillColor:[246,240,233],textColor:[30,36,48],fontStyle:'bold'},
    columnStyles:{0:{cellWidth:16},1:{cellWidth:11,halign:'center'},2:{cellWidth:44},3:{cellWidth:24},4:{cellWidth:16},5:{cellWidth:'auto'},6:{cellWidth:11,halign:'center'},7:{cellWidth:11,halign:'center'},8:{cellWidth:13,halign:'right',fontStyle:'bold'}},margin:{left:10,right:10,top:20}});
  y=doc.lastAutoTable.finalY+5;const pm={};L.forEach(x=>{pm[x.mat]=pm[x.mat]||{n:x.nome,v:0,c:0};pm[x.mat].v+=x.min||0;pm[x.mat].c++});const pl=Object.entries(pm).sort((p,q)=>p[1].n.localeCompare(q[1].n));
  if(y>235){doc.addPage();y=22}doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(22,48,60);doc.text('Total por colaborador',10,y);
  doc.autoTable({startY:y+2,head:[['Mat.','Colaborador','Lançamentos','Horas']],body:pl.map(([m,p])=>[m,tc(p.n),p.c,hm(p.v)]),foot:[['','Total',L.length,hm(tot)]],showFoot:'lastPage',tableWidth:120,styles:{fontSize:7.6,cellPadding:1.1},headStyles:{fillColor:[192,88,47]},footStyles:{fillColor:[246,240,233],textColor:[30,36,48],fontStyle:'bold'},columnStyles:{0:{cellWidth:14},2:{halign:'center',cellWidth:22},3:{halign:'right',cellWidth:18,fontStyle:'bold'}},margin:{left:10}});
  assinaturas(doc,CFG().assHE,doc.lastAutoTable.finalY+8,W);rodape(doc,W);
  await salvarArq('Horas extras Servicos Gerais - '+compCap(COMP).replace('/',' ')+'.pdf',new Uint8Array((await logos(doc)).output('arraybuffer')),'application/pdf')}
function rodape(doc,W){const n=doc.internal.getNumberOfPages(),H=doc.internal.pageSize.getHeight();for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(7.2);doc.setTextColor(130,136,148);doc.text('Emitido em '+new Date().toLocaleDateString('pt-BR')+' por '+quem()+' · Página '+p+' de '+n,W-10,H-6,{align:'right'})}}
