<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartões Sysprocard</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1d2433;--mut:#667085;--line:#e4e7ec;--trk:#eef0f4;
 --acc:#2e8a57;--acc2:#1d5c3a;--accbg:#e8f4ee;
 --ok:#2e8a57;--okbg:#e6f3ec;--warn:#b7791f;--warnbg:#fcf1dc;--bad:#b42318;--badbg:#fdecea;--info:#5b5f97;--infobg:#eeeefa;--mutbg:#f1f3f6}
body.t-convenio{--acc:#7d1a2c;--acc2:#4a0e1a;--accbg:#f7e9ec}
body.t-premium{--acc:#b8902a;--acc2:#6e5208;--accbg:#fbf4e1}
body.t-premium header{background:linear-gradient(120deg,#5c4306,#9c7716 55%,#d4b04a)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
header{background:linear-gradient(120deg,var(--acc2),var(--acc));color:#fff}
.hin{max-width:1280px;margin:0 auto;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:6px 10px;display:flex}.logo img{height:40px;display:block}
.ttl{flex:1;min-width:220px}.ttl .eb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.ttl h1{margin:2px 0 0;font-size:22px}.ttl small{display:block;opacity:.85;font-size:12.5px;margin-top:2px}
.hacts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 13px;font:600 13px inherit;font-family:inherit;cursor:pointer}
header .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}header .btn:hover{background:rgba(255,255,255,.24)}
main{max-width:1280px;margin:0 auto;padding:16px 18px 40px}
.read{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.read>div{padding:14px 16px;border-top:3px solid var(--acc)}.read>div+div{border-left:1px solid var(--line)}
.read>div:nth-child(2){border-top-color:var(--bad)}.read>div:nth-child(3){border-top-color:var(--warn)}
.read h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.read p{margin:0;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;border-left:4px solid var(--c,var(--acc))}
.kpi:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}.kpi.on{outline:2px solid var(--c,var(--acc));outline-offset:-1px}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15;margin-top:2px}.kpi .s{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box h2{margin:0 0 2px;font-size:16px}.box .sub{margin:0 0 10px;color:var(--mut);font-size:12.5px}
.hr{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:5px 6px;border-radius:7px;cursor:pointer;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left}
.hr:hover{background:var(--mutbg)}.hr.on{background:var(--accbg)}
.hr .n{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hr .t{height:10px;background:var(--trk);border-radius:5px;overflow:hidden;display:flex}.hr .t i{display:block;height:100%}
.hr .v{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mut)}.hr .v b{color:var(--ink)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:6px}.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;background:var(--card);color:var(--ink)}
.tools input{min-width:220px;flex:1}.tools .cnt{color:var(--mut);font-size:12.5px;margin-left:auto}
.tab{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:#f8f9fb;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:8px 10px;z-index:1}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}td .sm{font-size:11.5px;color:var(--mut)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-mut{background:var(--mutbg);color:var(--mut)}
.mini{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 9px;font:600 12px inherit;font-family:inherit;cursor:pointer;color:var(--ink);white-space:nowrap}
.mini.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.more{display:block;margin:10px auto 0}
.foot{color:var(--mut);font-size:12px;margin-top:14px}
.verif{background:#fff7e6;border:2px solid #e9a23b;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.verif h2{margin:0 0 2px;font-size:16px;color:#7a4a00}.verif .sub{margin:0 0 8px;font-size:12.5px;color:#7a5a20}
.verif table{background:#fff;border-radius:8px;overflow:hidden}.verif td,.verif th{font-size:13px}
.vtabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.vtabs button{border:0;background:none;padding:9px 16px;font:600 14px inherit;font-family:inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.vtabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
.cov2{columns:2;column-gap:28px}.cov2 .hr{break-inside:avoid}
@media (max-width:900px){.cov2{columns:1}}
header .btn.rel{background:#fff;color:var(--acc2);border-color:#fff}
.rl-fundo{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.rl{background:#fff;border-radius:12px;max-width:620px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.rl-cab{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}.rl-cab h3{margin:0;flex:1;font-size:16px}.rl-cab small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.rl-corpo{padding:14px 18px}.rl-op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.rl-op input{margin-top:3px}.rl-op b{display:block}.rl-op span{font-size:12.5px;color:var(--mut)}
.rl-lin{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 0;font-size:13px}.rl-lin label{display:flex;gap:6px;align-items:center;cursor:pointer}
.rl-pe{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.tmc{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.tmc input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:#f8f9fb}
.tmm{display:flex;flex-direction:column;gap:6px;font-size:13.5px}.tmm label{display:flex;gap:8px;align-items:center;cursor:pointer}
.tmrow{gap:10px}.tminfo{background:var(--mutbg);border-radius:8px;padding:9px 11px;font-size:13px}.tminfo.ok{background:var(--okbg);color:#1d4d33}.tminfo.av{background:var(--warnbg);color:#7a4a00}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:50}
.selb{display:flex;gap:8px;align-items:center;background:var(--accbg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px;flex-wrap:wrap}
@media (max-width:900px){.read{grid-template-columns:1fr}.read>div+div{border-left:0;border-top-width:3px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="hin">
  <span class="logo"><img alt="CRV Industrial" src="__CRV_BASE__img/logo-crv.png"></span>
  <div class="ttl"><div class="eb">Benefícios · Sysprocard</div><h1 id="tit">Cartão</h1><small id="sub"></small></div>
  <div class="hacts"><button class="btn rel" id="bR">Relatório de conferência</button><button class="btn" id="bX">Excel</button><button class="btn" id="bP">PDF</button></div>
</div></header>
<main>
  <section class="verif" id="verif" hidden></section>
  <section class="read" id="read"></section>
  <section class="kpis" id="kpis"></section>
  <nav class="vtabs" id="vtabs"><button data-v="s">Por setor</button><button data-v="n">Nominal</button></nav>
  <section class="box" id="vS">
    <h2>Cobertura por setor</h2><p class="sub" id="covSub"></p><div class="lg" id="covLg"></div><div id="cov" class="cov2"></div>
  </section>
  <section class="box" id="vN">
    <h2 id="lt">Lista</h2><p class="sub" id="ls"></p>
    <div class="tools">
      <input id="q" type="search" placeholder="Buscar nome, matrícula ou função">
      <select id="fCat"></select><select id="fDep"></select><select id="fSit"></select>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="selb" id="selb" hidden></div>
    <div class="tab"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    <button class="btn more" id="more" hidden>Mostrar mais</button>
  </section>
  <p class="foot" id="foot"></p>
</main>
<div class="toast" id="toast" hidden></div>
<script>/*__CRV_DADOS_0__*/</script>
<script>
(function(){
'use strict';
const C=CARTAO, T=C.tipo;
document.body.classList.add('t-'+T);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=n=>Number(n).toLocaleString('pt-BR');
const pc=(a,b)=>b?Math.round(a/b*100)+'%':'–';
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const tc=s=>String(s||'').toLowerCase().replace(/(^|[\s\/(.-])(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/ (Da|De|Do|Dos|Das|E) /g,m=>m.toLowerCase()).replace(/\b(Ii|Iii|Iv|Vi|Vii|Ctt|Crv|Adm|Rh|Mg|Coa|Pcm)\b/g,m=>m.toUpperCase());
const moeda=v=>v==null||v===''?'':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}

/* ---------- regras por cartão ---------- */
const PREM_TXT='Só podem ter: Motorista I, II e III e Operador de Máquinas Agrícolas I, II e III.';
const CATS={
 ok:   {l:T==='convenio'?'Convênio liberado':'Têm o cartão',c:'var(--ok)',p:'p-ok',acao:'—'},
 falta:{l:'Falta pedir',c:'var(--bad)',p:'p-bad',acao:'Pedir o cartão na Sysprocard'},
 bloq: {l:T==='convenio'?'Cartão sem convênio liberado':'Cartão bloqueado',c:'var(--warn)',p:'p-warn',acao:T==='convenio'?'Liberar só se o colaborador pedir':'Conferir e pedir o desbloqueio ou 2ª via'},
 regra:{l:'Fora da regra',c:'var(--info)',p:'p-info',acao:'Função não permitida no Premium: conferir e bloquear'},
 desl: {l:'Desligados com cartão ativo',c:'var(--bad)',p:'p-bad',acao:'Bloquear o cartão'},
 fora: {l:'Matrícula fora do Quadro',c:'var(--warn)',p:'p-warn',acao:'Conferir quem é e bloquear se não estiver na empresa'},
 afast:{l:'Afastados',c:'var(--mut)',p:'p-mut',acao:T==='alimentacao'?'Afastado não recebe o vale (exceto acidente de trabalho)':'Acompanhar no retorno'}
};
function cat(r){
  if(r.sit==='Fora do quadro')return r.card==='Ativo'?'fora':null;
  if(r.sit==='Desligado')return r.card==='Ativo'?'desl':null;
  if(T==='premium'&&!r.eleg)return r.card==='Ativo'?'regra':null;
  if(r.sit==='Afastado'&&T!=='convenio')return 'afast';
  return r.card==='Ativo'?'ok':r.card?'bloq':'falta';
}
const R=C.rows.map(r=>Object.assign(r,{k:cat(r),N:tc(r.nome),F:tc(r.func)})).filter(r=>r.k);
const ORD=T==='premium'?['ok','falta','bloq','regra','desl','fora','afast']:['ok','falta','bloq','desl','fora','afast'];
const PEDE=new Set(['falta','bloq','desl','fora','regra']);

/* ---------- limite do convênio (regra) ---------- */
const OPMOT=/MOTORISTA|OPERADOR|OP\. DE MAQ/;
let EXC={};(C.exc540||[]).forEach(m=>EXC[String(m)]={on:true,origem:'lista'});
function regra(r){
  const esp=(C.excEsp||{})[r.mat];if(esp)return{v:esp[0],t:esp[1]};
  if(EXC[r.mat]&&EXC[r.mat].on)return{v:540,t:'Exceção (R$ 540)'};
  if(r.aloj&&OPMOT.test(r.func))return{v:1080,t:'Alojado, operador/motorista (R$ 1.080)'};
  if(/^ind[uú]stria$/i.test(r.dep))return{v:180,t:'Indústria (R$ 180)'};
  return{v:200,t:'Demais áreas (R$ 200)'};
}
const limAtual=r=>r.lim!=null&&r.lim>0.05?Number(r.lim):null;
function difLim(r){if(T!=='convenio'||r.k!=='ok')return'';const a=limAtual(r),g=regra(r).v;if(a==null)return'';return a>g+0.05?'acima':a<g-0.05?'abaixo':'certo'}

/* ---------- pedidos marcados no app ---------- */
let DB=null,PED={},podeEd=true,VER={};
async function lerPedidos(){try{if(!(window.claude&&window.claude.use))return;DB=await window.claude.use('db');const s=await DB.collection('pedidos').get();PED={};s.docs.forEach(d=>{const x=d.data();if(!x.desfeito)PED[d.id]=x});
  if(T==='convenio'){const e=await DB.collection('excecoes').get();e.docs.forEach(d=>{EXC[d.id]=d.data()});const v=await DB.collection('verificados').get();v.docs.forEach(d=>{VER[d.id]=d.data()})}render()}catch(_){}}
async function verificar(m,ok){
  if(!DB){toast('Não dá para salvar nesta visualização.');return}
  const nota=ok?(prompt0(m)||''):'';
  try{const x={ok,em:new Date().toISOString(),por:(window.parent&&window.parent.CRV_QUEM)||'',nota};await DB.collection('verificados').doc(m).set(x);VER[m]=x;toast(ok?'Marcado como verificado.':'Voltou para a lista a verificar.');render()}
  catch(e){toast('Não consegui salvar: '+((e&&e.message)||'sem permissão.'))}
}
function prompt0(m){const i=document.querySelector('[data-nota="'+m+'"]');return i?i.value.trim():''}
async function excecao(m,on){
  if(!DB){toast('Não dá para salvar nesta visualização.');return}
  try{const x={on,em:new Date().toISOString(),por:(window.parent&&window.parent.CRV_QUEM)||''};await DB.collection('excecoes').doc(m).set(x);EXC[m]=x;toast(on?'Exceção de R$ 540 registrada.':'Exceção retirada.');render()}
  catch(e){toast('Não consegui salvar: '+((e&&e.message)||'sem permissão.'))}
}
async function marcar(mats,desfazer){
  if(!DB){toast('Não dá para salvar nesta visualização.');return}
  const quem=(window.parent&&window.parent.CRV_QUEM)||'',hoje=new Date().toISOString();
  try{for(const m of mats){const r=R.find(x=>x.mat===m);const acao=r?CATS[r.k].acao:'';
      if(desfazer){await DB.collection('pedidos').doc(m).set({desfeito:true,em:hoje,por:quem});delete PED[m]}
      else{const x={em:hoje,por:quem,cat:r?r.k:'',acao};await DB.collection('pedidos').doc(m).set(x);PED[m]=x}}
    toast(desfazer?'Marcação desfeita.':(mats.length>1?mats.length+' marcados como pedido feito.':'Marcado como pedido feito.'));render();
  }catch(e){toast('Não consegui salvar: '+((e&&e.message)||'sem permissão para editar este painel.'))}
}

/* ---------- filtros ---------- */
const S={cat:'',dep:'',ger:'',sit:'',q:'',lim:150,dl:'',v:'s'};
const deps=[...new Set(R.map(r=>r.dep))].sort((a,b)=>a.localeCompare(b));
const gers=[...new Set(R.map(r=>r.ger).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
$('fCat').innerHTML='<option value="">Todas as situações do cartão</option>'+ORD.map(k=>`<option value="${k}">${CATS[k].l}</option>`).join('')+'<option value="pedido">Já solicitados (marcados no app)</option>';
$('fDep').innerHTML='<option value="">Todos os setores</option>'+deps.map(d=>`<option>${esc(d)}</option>`).join('');
$('fSit').innerHTML='<option value="">Situação no Quadro: todas</option>'+['Ativo','Afastado','Desligado','Fora do quadro'].map(x=>`<option>${x}</option>`).join('');
const sel=(skip)=>R.filter(r=>(skip==='cat'||!S.cat||(S.cat==='pedido'?!!PED[r.mat]&&PEDE.has(r.k):r.k===S.cat))&&(skip==='dep'||!S.dep||r.dep===S.dep)&&(skip==='ger'||!S.ger||r.ger===S.ger)&&(!S.sit||r.sit===S.sit)&&(!S.dl||(S.dl==='exc'?!!(EXC[r.mat]&&EXC[r.mat].on):S.dl==='aloj'?regra(r).v===1080:difLim(r)===S.dl))&&(!S.q||(r.nome+' '+r.mat+' '+r.func).toUpperCase().includes(S.q.toUpperCase())));
const alvo=r=>(r.sit==='Ativo'||(T==='convenio'&&r.sit==='Afastado'))&&(T!=='premium'||r.eleg);

function render(){
  const tit={alimentacao:'Cartão Alimentação',convenio:'Cartão Convênio',premium:'Cartão Premium'}[T];
  $('tit').textContent=tit;
  $('sub').textContent=`Planilha Sysprocard ${C.arquivo} de ${br(C.refPlanilha)} · cruzada com o Quadro Geral (empresa 5) de ${br(C.refQuadro)}`;
  const n=k=>R.filter(r=>r.k===k).length, A=R.filter(alvo), aOk=A.filter(r=>r.k==='ok').length;
  const pend=R.filter(r=>PEDE.has(r.k)&&!PED[r.mat]);
  const pedidos=R.filter(r=>PEDE.has(r.k)&&PED[r.mat]).length;
  /* leitura */
  const grupo=T==='premium'?'motoristas e operadores de máquinas (I, II e III) ativos':T==='convenio'?'colaboradores ativos e afastados':'colaboradores ativos';
  const top=(()=>{const m={};A.filter(r=>r.k!=='ok').forEach(r=>m[r.dep]=(m[r.dep]||0)+1);const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e})();
  const att=[];
  if(n('desl'))att.push(`<b>${nf(n('desl'))} desligados ainda com cartão ativo</b>`);
  if(n('fora'))att.push(`<b>${nf(n('fora'))} cartões ativos com matrícula que não está no Quadro</b>`);
  if(T==='premium'&&n('regra'))att.push(`<b>${nf(n('regra'))} com Premium em função não permitida</b>`);
  const faz=[];
  if(n('falta'))faz.push(`Pedir ${nf(n('falta'))} cartão(ões)`+(pedidos?` (${nf(pedidos)} já marcados como pedido)`:''));
  if(n('desl')+n('fora'))faz.push(`Bloquear/conferir ${nf(n('desl')+n('fora'))} cartão(ões) ativos de quem não está na empresa`);
  if(T!=='convenio'&&n('bloq'))faz.push(`Conferir ${nf(n('bloq'))} ${T==='premium'?'elegíveis':'ativos'} com cartão bloqueado`);
  if(T==='premium'&&n('regra'))faz.push(`Revisar ${nf(n('regra'))} Premium fora da regra`);
  $('read').innerHTML=`<div><h3>Onde estamos</h3><p>${T==='convenio'?`<b>${nf(aOk)} de ${nf(A.length)}</b> ${grupo} (${pc(aOk,A.length)}) estão com o convênio liberado. ${nf(n('bloq'))} têm o cartão emitido sem convênio liberado e <b>${nf(n('falta'))}</b> ainda não têm cartão.`:`<b>${nf(aOk)} de ${nf(A.length)}</b> ${grupo} (${pc(aOk,A.length)}) têm o cartão ativo.${T==='premium'?' '+PREM_TXT:''}`}${top?` Setor com mais pendências: <b>${esc(top[0])}</b> (${nf(top[1])}).`:''}</p></div>
   <div><h3>Ponto de atenção</h3><p>${att.length?att.join('; ')+'.':'Nenhum cartão ativo de quem já saiu da empresa.'}</p></div>

 :k==='bloq'?[['Matrícula',r=>r.mat],['Nome',r=>r.nome],['ID do cartão',r=>r.idc],['CPF (cartão)',r=>r.cpfC||''],['Motivo',r=>r.k==='desl'?'Desligado em '+br(r.desl):r.k==='regra'?'Função não permitida: '+r.func:'Matrícula fora do Quadro'+(r.outraMat?' (mesmo CPF da mat. '+r.outraMat+')':'')],['Setor',r=>r.dep&&r.dep!=='Fora do Quadro'?tc(r.dep):'']]
 :[['Matrícula',r=>r.mat],['Nome',r=>r.nome],['ID do cartão',r=>r.idc],['Setor',r=>tc(r.dep)],['Limite atual',r=>moeda(limAtual(r))],['Limite da regra',r=>moeda(regra(r).v)],['Regra',r=>regra(r).t]];
async function gerarRel(sec,fmt){
  const hoje=new Date().toLocaleDateString('pt-BR'),nome=`Conferencia ${NOMET.replace('ã','a').replace('ê','e')} ${hoje.split('/').join('-')}`;
  if(fmt==='xlsx'){
    const X=window.XLSX||(window.parent&&window.parent.XLSX);if(!X)throw new Error('gerador de Excel indisponível');
    const wb=X.utils.book_new();
    sec.forEach(x=>{const cs=colsRel(x.k);const aoa=[[`${NOMET} · ${x.t} · ${x.L.length} pessoas · gerado em ${hoje}`],[],cs.map(c=>c[0]).concat(['Conferido','Solicitado em'])].concat(x.L.map(r=>cs.map(c=>c[1](r)).concat(['',''])));
      const ws=X.utils.aoa_to_sheet(aoa);ws['!cols']=cs.map(c=>({wch:c[0]==='Nome'?40:c[0]==='Motivo'?42:16})).concat([{wch:11},{wch:14}]);X.utils.book_append_sheet(wb,ws,x.t.slice(0,31))});
    await salvar(nome+'.xlsx',new Uint8Array(X.write(wb,{bookType:'xlsx',type:'array'})),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');return;
  }
  const J=(window.jspdf&&window.jspdf.jsPDF)||(window.parent&&window.parent.jspdf&&window.parent.jspdf.jsPDF);if(!J)throw new Error('gerador de PDF indisponível');
  const doc=new J({orientation:'landscape',unit:'mm',format:'a4'});if(typeof doc.autoTable!=='function')throw new Error('gerador de tabela indisponível');
  const cor=T==='premium'?[184,144,42]:T==='convenio'?[125,26,44]:[46,138,87];
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(`Relatório de conferência · ${NOMET} · Sysprocard`,12,14);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(`Gerado em ${hoje} · planilha Sysprocard de ${br(C.refPlanilha)} cruzada com o Quadro Geral (empresa 5) de ${br(C.refQuadro)} · ${sec.map(x=>x.t+': '+x.L.length).join(' · ')}`,12,19.5);
  let y=25;
  sec.forEach((x,i)=>{
    if(i&&y>170){doc.addPage();y=15}
    doc.setFillColor(...cor);doc.rect(12,y,273,7,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(`${x.t.toUpperCase()} · ${x.L.length} ${x.L.length===1?'pessoa':'pessoas'}`,14,y+4.8);doc.setTextColor(0);
    const cs=colsRel(x.k);
    doc.autoTable({startY:y+8,head:[['#'].concat(cs.map(c=>c[0])).concat(['Conferido'])],body:x.L.map((r,j)=>[String(j+1)].concat(cs.map(c=>String(c[1](r)??''))).concat(['[   ]'])),
      styles:{fontSize:7.5,cellPadding:1.5,valign:'middle'},headStyles:{fillColor:[238,241,245],textColor:20,fontStyle:'bold'},columnStyles:{0:{cellWidth:8}},margin:{left:12,right:12}});
    y=doc.lastAutoTable.finalY+8;
  });
  if(y>180){doc.addPage();y=20}
  doc.setFontSize(9);doc.line(12,y+12,110,y+12);doc.text('Conferido por (RH)',12,y+16);doc.line(130,y+12,190,y+12);doc.text('Data',130,y+16);
  await salvar(nome+'.pdf',new Uint8Array(doc.output('arraybuffer')),'application/pdf');
}

/* ---------- Termo de opção do Cartão Convênio (impressão) ---------- */
const MESX=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const hojeISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const numBR=v=>{let t=String(v||'').replace(/[R$\s]/g,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');return parseFloat(t)};
async function pessoaTermo(m){
  const r=C.rows.find(x=>x.mat===m&&x.sit!=='Desligado'&&x.sit!=='Fora do quadro');
  if(r)return r;
  try{const f=window.parent&&window.parent.CRV_QUADRO;if(typeof f==='function'){const q=await f();const c=q&&q.mapa&&q.mapa[m];if(c&&c.situacao!=='Desligado')return{mat:m,nome:c.nome,func:c.funcao,dep:c.setor,sit:c.situacao,cpf:''}}}catch(_){}
  return null;
}
function abrirTermo(){
  if(T!=='convenio')return;
  const w=document.createElement('div');w.className='rl-fundo';
  w.innerHTML=`<div class="rl" role="dialog" aria-modal="true" style="max-width:720px"><div class="rl-cab"><h3>Termo de opção · Cartão Convênio<small>Para imprimir quando o colaborador pede o cartão e o convênio é liberado. A matrícula puxa os dados e o valor da regra.</small></h3><button class="mini" id="tmX">Fechar</button></div>
   <div class="rl-corpo" style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
    <label class="tmc" style="grid-column:span 2">Matrícula<input id="tmMat" inputmode="numeric" placeholder="ex.: 41841"></label>
    <label class="tmc" style="grid-column:span 4">Nome<input id="tmNome"></label>
    <label class="tmc" style="grid-column:span 2">CPF<input id="tmCpf" placeholder="só números"></label>
    <label class="tmc" style="grid-column:span 2">Valor do crédito (R$)<input id="tmVal" inputmode="decimal"></label>
    <label class="tmc" style="grid-column:span 2">Data do termo<input id="tmData" type="date" value="${hojeISO()}"></label>
    <div style="grid-column:1/-1" class="tmm"><b style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em">Modelo do termo</b>
      <label><input type="radio" name="tmMod" value="padrao" checked> Padrão (desconto integral em folha)</label>
      <label><input type="radio" name="tmMod" value="aloj"> Alojamento – motoristas e operadores (50% empresa, 50% colaborador)</label></div>
    <div id="tmRef" style="grid-column:1/-1;display:none;gap:10px" class="tmrow"><label class="tmc">Almoço (R$)<input id="tmAlm" value="18,00"></label><label class="tmc">Jantar (R$)<input id="tmJan" value="18,00"></label></div>
    <div id="tmInfo" style="grid-column:1/-1" class="tminfo">Digite a matrícula.</div>
    <div style="grid-column:1/-1"><b style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em">Termos já emitidos</b><div id="tmLista" class="tab" style="max-height:180px;margin-top:6px"></div></div>
   </div>
   <div class="rl-pe"><span id="tmMsg" style="flex:1;color:var(--mut);font-size:12.5px"></span><button class="btn" id="tmC">Cancelar</button><button class="btn" id="tmG" style="background:var(--acc);border-color:var(--acc);color:#fff">Gerar PDF para imprimir</button></div></div>`;
  document.body.appendChild(w);
  const g=id=>w.querySelector('#'+id),fe=()=>w.remove();
  g('tmX').onclick=fe;g('tmC').onclick=fe;w.addEventListener('mousedown',e=>{if(e.target===w)fe()});
  const modo=()=>w.querySelector('input[name=tmMod]:checked').value;
  const syncMod=()=>{g('tmRef').style.display=modo()==='aloj'?'flex':'none'};
  w.querySelectorAll('input[name=tmMod]').forEach(i=>i.onchange=syncMod);
  let tm=null,ult='';
  const puxar=async()=>{const m=g('tmMat').value.trim().replace(/^0+(?=\d)/,'');if(!m||m===ult)return;ult=m;
    const p=await pessoaTermo(m);const inf=g('tmInfo');
    if(!p){inf.className='tminfo av';inf.textContent='Matrícula não encontrada entre os ativos da empresa 5. Preencha à mão.';return}
    const rg=regra(p);g('tmNome').value=p.nome;g('tmCpf').value=String(p.cpf||'').replace(/\D/g,'');g('tmVal').value=rg.v.toLocaleString('pt-BR',{minimumFractionDigits:2});
    w.querySelector(`input[name=tmMod][value=${rg.v===1080?'aloj':'padrao'}]`).checked=true;syncMod();
    const card=p.card?`cartão ${p.card.toLowerCase()} (ID ${p.idc})${limAtual(p)!=null?' · limite atual '+moeda(limAtual(p)):''}`:'ainda sem cartão convênio — pedir na Sysprocard';
    inf.className='tminfo ok';inf.innerHTML=`<b>${esc(tc(p.nome))}</b> · ${esc(tc(p.func))} · ${esc(tc(p.dep))}${p.aloj?' · alojado em '+esc(p.aloj):''}<br>Valor pela regra: <b>${moeda(rg.v)}</b> (${esc(rg.t)}) · ${esc(card)}`+(p.cpf?'':'<br><span style="color:var(--warn)">CPF não está no Quadro: digite.</span>');
  };
  g('tmMat').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(puxar,450)});g('tmMat').addEventListener('change',puxar);
  const listar=async()=>{const h=g('tmLista');if(!DB){h.innerHTML='<p class="sub" style="padding:8px">Registro indisponível nesta visualização.</p>';return}
    try{const q=await DB.collection('termos').get();const L=q.docs.map(d=>Object.assign({_id:d.id},d.data())).filter(x=>!x.excluido).sort((a,b)=>(b.em||'')<(a.em||'')?-1:1);
      h.innerHTML=L.length?`<table><thead><tr><th>Emitido</th><th>Colaborador</th><th>Valor</th><th>Modelo</th><th></th></tr></thead><tbody>${L.map(x=>`<tr data-id="${esc(x._id)}"><td>${br(x.data)}<div class="sm">${esc(String(x.por||'').split(' ')[0])}</div></td><td><b>${esc(tc(x.nome))}</b> · ${esc(x.mat)}</td><td>${moeda(x.valor)}</td><td>${x.modelo==='aloj'?'Alojamento':'Padrão'}</td><td style="text-align:right;white-space:nowrap"><button class="mini" data-a="pdf">Reimprimir</button> <button class="mini" data-a="ex" style="color:var(--bad)">Excluir</button></td></tr>`).join('')}</tbody></table>`:'<p class="sub" style="padding:8px;margin:0">Nenhum termo emitido ainda.</p>';
      h.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const x=L.find(y=>y._id===b.closest('tr').dataset.id);if(!x)return;
        if(b.dataset.a==='pdf'){await pdfTermo(x);return}
        if(b.textContent!=='Confirmar'){b.textContent='Confirmar';setTimeout(()=>{if(b.isConnected)b.textContent='Excluir'},6000);return}
        try{await DB.collection('termos').doc(x._id).update({excluido:true,excluidoEm:new Date().toISOString(),excluidoPor:(window.parent&&window.parent.CRV_QUEM)||''});listar()}catch(e){toast('Sem permissão para excluir.')}});
    }catch(_){h.innerHTML='<p class="sub" style="padding:8px">Não consegui ler os termos.</p>'}};
  listar();
  g('tmG').onclick=async()=>{
    const d={mat:g('tmMat').value.trim(),nome:g('tmNome').value.trim().toUpperCase(),cpf:g('tmCpf').value.replace(/\D/g,''),valor:numBR(g('tmVal').value),data:g('tmData').value||hojeISO(),modelo:modo(),almoco:numBR(g('tmAlm').value),jantar:numBR(g('tmJan').value)};
    const falta=[!d.mat&&'matrícula',!d.nome&&'nome',!d.cpf&&'CPF',isNaN(d.valor)&&'valor'].filter(Boolean);
    if(falta.length){g('tmMsg').style.color='var(--bad)';g('tmMsg').textContent='Falta preencher: '+falta.join(', ')+'.';return}
    try{await pdfTermo(d);
      if(DB){try{await DB.collection('termos').add(Object.assign({},d,{em:new Date().toISOString(),por:(window.parent&&window.parent.CRV_QUEM)||''}));listar()}catch(_){}}
      g('tmMsg').style.color='var(--ok)';g('tmMsg').textContent='PDF gerado. Imprima e colha a assinatura do colaborador.';
    }catch(e){g('tmMsg').style.color='var(--bad)';g('tmMsg').textContent='Não consegui gerar: '+(e.message||e)}
  };
  setTimeout(()=>g('tmMat').focus(),50);
}
async function imgData(u){const r=await fetch(u);const b=await r.blob();return await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(b)})}
async function pdfTermo(d){
  const J=(window.jspdf&&window.jspdf.jsPDF)||(window.parent&&window.parent.jspdf&&window.parent.jspdf.jsPDF);if(!J)throw new Error('gerador de PDF indisponível');
  const doc=new J({unit:'mm',format:'a4'});
  const NAVY=[31,58,104],INK=[40,46,58],MUT=[110,116,128],GREEN=[110,150,60];
  const L=18,R=192,W=R-L;
  const v=n=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const cpfF=c=>{const x=String(c||'').replace(/\D/g,'');return x.length===11?x.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):c};
  /* texto corrido com trechos em negrito: [[texto,negrito],...] */
  const rich=(segs,y,fs=10,lh=5.6)=>{
    doc.setFontSize(fs);const words=[];
    segs.forEach(([t,bd])=>String(t).split(/(\s+)/).forEach(w=>{if(w==='')return;words.push({w,bd:!!bd})}));
    let x=L;const lines=[[]];
    words.forEach(o=>{doc.setFont('helvetica',o.bd?'bold':'normal');const ww=doc.getTextWidth(o.w);
      if(/^\s+$/.test(o.w)){if(x===L)return;}
      if(x+ww>R&&!/^\s+$/.test(o.w)){lines.push([]);x=L;}
      if(/^\s+$/.test(o.w)&&x===L)return;
      lines[lines.length-1].push({...o,x});x+=ww;});
    lines.forEach(ln=>{ln.forEach(o=>{doc.setFont('helvetica',o.bd?'bold':'normal');doc.setTextColor(...INK);doc.text(o.w,o.x,y)});y+=lh});
    return y;
  };
  const sec=(t,y)=>{doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(...NAVY);doc.text(t,L,y);return y+7};
  /* cabeçalho */
  doc.setFillColor(...NAVY);doc.rect(0,0,210,4,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(...NAVY);doc.text('CRV INDUSTRIAL',L,21);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MUT);doc.text('UNIDADE CAPINÓPOLIS',L,26.5);
  doc.setDrawColor(...GREEN);doc.setLineWidth(0.6);doc.line(L,32,R,32);
  doc.setFont('helvetica','bold');doc.setFontSize(19);doc.setTextColor(...NAVY);doc.text('TERMO DE OPÇÃO',L,45);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(...INK);doc.text('Cartão Convênio Sysprocard',L,52);
  /* dados do colaborador */
  doc.setFillColor(238,241,245);doc.roundedRect(L,58,W,22,2,2,'F');
  doc.setFontSize(10);doc.setTextColor(...INK);
  doc.setFont('helvetica','bold');doc.text('Colaborador:',L+0.5,66.5);doc.setFont('helvetica','normal');doc.text(String(d.nome),L+24.5,66.5);
  doc.setFont('helvetica','bold');doc.text('Matrícula:',L+0.5,72);doc.setFont('helvetica','normal');doc.text(String(d.mat),L+0.5+doc.getTextWidth('Matrícula:')+2,72);
  doc.setFont('helvetica','bold');doc.text('CPF:',L+40,72);const wc=doc.getTextWidth('CPF:');doc.setFont('helvetica','normal');doc.text(cpfF(d.cpf),L+40+wc+2,72);
  /* corpo */
  let y=rich([['Declaro que recebi os esclarecimentos da empresa e opto pelo recebimento do ticket-refeição por meio do Cartão Convênio Sysprocard físico, conforme as condições abaixo.']],93)+3;
  y=sec('1. UTILIZAÇÃO DO CARTÃO',y);
  y=rich([['O cartão é pessoal e intransferível. Sua utilização é restrita a estabelecimentos do segmento de refeições, como restaurantes, padarias e lanchonetes, que aceitem o Cartão Convênio Sysprocard.']],y)+3;
  if(d.modelo==='aloj'){
    y=sec('2. CRÉDITO E PARTICIPAÇÃO NO CUSTO',y);
    y=rich([['O valor creditado é de '],['R$ '+v(d.valor),1],['. Para motoristas e operadores de máquinas agrícolas, conforme a política da empresa aplicável à respectiva função, o custo é dividido em '],['50% pagos pela empresa',1],[' e '],['50% descontados em folha de pagamento do colaborador',1],['.']],y);
    y=rich([['Valores de referência por refeição: '],['almoço: R$ '+v(d.almoco||18),1],[' e '],['jantar: R$ '+v(d.jantar||18),1],['.']],y)+3;
  }else{
    y=sec('2. CRÉDITO E DESCONTO EM FOLHA',y);
    y=rich([['O valor do crédito é de '],['R$ '+v(d.valor),1],['. Declaro estar ciente e de acordo com o desconto em folha de pagamento do valor utilizado no período de apuração.']],y)+3;
  }
  y=sec('3. PERÍODO DE APURAÇÃO E COBRANÇA',y);
  y=rich([['O período de apuração compreende o '],['dia 21 de um mês ao dia 20 do mês subsequente',1],['. O desconto correspondente ao valor utilizado, observada a participação prevista neste termo, será realizado na folha de pagamento, com cobrança no '],['5º dia útil',1],[', conforme o processamento da empresa.']],y)+3;
  y=sec('4. CIÊNCIA DAS CONDIÇÕES',y);
  y=rich([['Declaro que li e compreendi as condições de utilização do cartão e de desconto em folha descritas neste termo, estando de acordo com a opção registrada.']],y);
  /* data e assinatura */
  const dt=new Date(d.data+'T12:00:00');
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...INK);
  doc.text(`Capinópolis/MG, ${String(dt.getDate()).padStart(2,'0')} de ${MESX[dt.getMonth()].toLowerCase()} de ${dt.getFullYear()}.`,105,Math.max(y+30,232),{align:'center'});
  const ya=Math.max(y+50,252);doc.setDrawColor(...INK);doc.setLineWidth(0.3);doc.line(55,ya,155,ya);doc.text('Assinatura do colaborador',105,ya+5,{align:'center'});
  /* rodapé */
  doc.setDrawColor(215,220,228);doc.setLineWidth(0.3);doc.line(L,271,R,271);
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...INK);doc.text('CRV INDUSTRIAL LTDA - UNIDADE CAPINÓPOLIS | CNPJ 03.937.452/0004-35',105,276,{align:'center'});
  doc.setFont('helvetica','normal');doc.setTextColor(...MUT);doc.text('Rodovia MG-226, s/nº, km 63, Zona Rural, Capinópolis/MG - CEP 38.360-000',105,280.2,{align:'center'});doc.text('Telefone: (34) 3263-8100',105,284.4,{align:'center'});
  await salvar(`Termo de opcao Cartao Convenio - ${String(d.nome).split(' ')[0]} ${d.mat}.pdf`,new Uint8Array(doc.output('arraybuffer')),'application/pdf');
}
if(T==='convenio'){const b=document.createElement('button');b.className='btn rel';b.id='bT';b.textContent='Termo de opção';b.onclick=abrirTermo;document.querySelector('.hacts').insertBefore(b,document.getElementById('bR'));}
window.CRV_TERMO=abrirTermo;
$('bR').onclick=abrirRel;
window.CRV_RELATORIO=abrirRel;
window.CRV_CONV={T,rows:C.rows,regra,excEsp:C.excEsp||{}};
render();lerPedidos();
})();
</script>

</style>
<script>
(function(){
const V=window.CRV_CONV;if(!V||V.T!=='convenio')return;
const e_=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const quem=()=>(window.parent&&window.parent.CRV_QUEM)||'';
const MESN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const tcx=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()).replace(/ (Da|De|Do|Dos|Das|E) /g,(m,p)=>' '+p.toLowerCase()+' ');
let DB=null;const db=async()=>{if(DB)return DB;try{DB=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(_){DB=null}return DB};
const ROW={};V.rows.forEach(r=>{ROW[String(r.mat)]=r});
let FS=[],F=null,W=null,TAB='pes',FIL='',Q='';
async function lerTodos(){const D=await db();if(!D){FS=[];return}try{const s=await D.collection('fechamentos').get();FS=s.docs.map(d=>Object.assign({_id:d.id},d.data())).filter(x=>!x.excluido).sort((a,b)=>String(b._id).localeCompare(String(a._id)))}catch(_){FS=[]}}
async function gravar(){const D=await db();if(!D)throw new Error('O registro não está disponível nesta visualização.');F.atualizadoEm=new Date().toISOString();F.por=quem();const o=Object.assign({},F);delete o._id;await D.collection('fechamentos').doc(F._id).set(o)}
const descDe=x=>x.marc==='SIM'?Math.round(x.valor*50)/100:x.marc==='NÃO'?0:x.valor;
/* ---------- leitura do TXT da Sysprocard ---------- */
async function lerTxt(file){const buf=await file.arrayBuffer();let t;try{t=new TextDecoder('windows-1252').decode(buf)}catch(_){t=new TextDecoder().decode(buf)}
  const per=t.match(/PERIODO DE\s+(\d{2})\/(\d{2})\/(\d{4})\s+A\s+(\d{2})\/(\d{2})\/(\d{4})/i);
  const L=[];t.split(/\r?\n/).forEach(l=>{const m=l.match(/^(.+?)\s{2,}(\d+)\s+([\d.]+,\d{2})\s*$/);if(m&&!/^Nome\b/i.test(m[1]))L.push({nometxt:m[1].trim(),mat:String(+m[2]),valor:+m[3].replace(/\./g,'').replace(',','.')})});
  const tot=t.match(/QTDE\s*:\s*0*(\d+)\s+([\d.]+,\d{2})/);
  if(!L.length)throw new Error('Não encontrei lançamentos no arquivo. Confira se é o TXT de consumo da Sysprocard.');
  return{ini:per?per[3]+'-'+per[2]+'-'+per[1]:'',fim:per?per[6]+'-'+per[5]+'-'+per[4]:'',L,qtde:tot?+tot[1]:null,total:tot?+tot[2].replace(/\./g,'').replace(',','.'):null}}
async function montar(tx){const q=window.parent&&window.parent.CRV_QUADRO?await window.parent.CRV_QUADRO():null;const M=(q&&q.mapa)||{};
  const ant=FS.find(f=>f.fim<tx.fim);const AM={};(ant&&ant.itens||[]).forEach(x=>{AM[x.mat]=x});
  const itens=tx.L.map(t=>{const p=M[t.mat]||{},r=ROW[t.mat]||{},a=AM[t.mat]||{};const conf=[];
    let marc='';
    if(V.excEsp[t.mat]){marc='NÃO';conf.push('Valor pago pela empresa ('+V.excEsp[t.mat][1]+'): sem desconto')}
    else if(r.mat&&V.regra(r).v===1080)marc='SIM';
    else if(a.marc==='SIM'){marc='SIM';conf.push('Desconto de metade como no fechamento anterior, mas não está como alojado com limite de R$ 1.080: confirmar')}
    if(!marc&&r.aloj)conf.push('Está no alojamento ('+r.aloj+'), mas o limite não é de R$ 1.080: desconto integral');
    const cc=p.cc||a.cc||'',ccd=p.ccd||a.ccd||'';
    if(!p.nome)conf.push('Matrícula não encontrada no Quadro');
    if(p.situacao==='Desligado')conf.push('Desligado em '+br(p.deslig)+': descontar na rescisão');
    if(p.situacao==='Afastado')conf.push('Afastado no Quadro');
    if(a.cc&&p.cc&&String(a.cc)!==String(p.cc))conf.push('Centro de custo mudou: antes '+a.cc+', agora '+p.cc);
    if(!cc)conf.push('Sem centro de custo: informar');
    return{mat:t.mat,nome:p.nome||t.nometxt,func:p.funcao||'',valor:t.valor,marc,cc:String(cc),ccd,desl:p.situacao==='Desligado',conf}});
  return{_id:tx.fim.slice(0,7),ini:tx.ini,fim:tx.fim,itens,qtde:tx.qtde,totalTxt:tx.total,cc:{},ccRef:'',criadoEm:new Date().toISOString(),criadoPor:quem()}}
/* ---------- saldos por centro de custo (PDF ou Excel do ControlOnFarm) ---------- */
const num=s=>+String(s).replace(/\./g,'').replace(',','.');
function parseSaldos(linhas){const CC={};let ref='',per='';
  linhas.forEach(l=>{const g=l.match(/Gerado em (\d{2}\/\d{2}\/\d{4})/);if(g)ref=g[1];const p=l.match(/Per[ií]odo:\s*(\d{2}\/\d{2}\/\d{4}) a (\d{2}\/\d{2}\/\d{4})/);if(p)per=p[1]+' a '+p[2];
    const m=l.replace(/\s+/g,' ').trim().match(/^(\d{3,5}) (.+?) (Agrícola|Indústria|Administrativo|Agricola|Industria) (-?[\d.]+,\d{2}) (-?[\d.]+,\d{2}) (-?[\d.]+,\d{2}) (-?[\d.]+,\d{2})% ?(\S+)?/);
    if(m)CC[m[1]]={nome:m[2],un:m[3],prev:num(m[4]),real:num(m[5]),dif:num(m[6]),pct:num(m[7]),st:m[8]||''}});
  return{CC,ref,per}}
async function pdfLinhas(file){
  if(!window.pdfjsLib){await new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=()=>er(new Error('Não consegui carregar o leitor de PDF.'));document.head.appendChild(s)});
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();const rows=new Map();
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/3);const a=rows.get(y)||[];a.push([it.transform[4],it.str]);rows.set(y,a)});
    [...rows.entries()].sort((a,b)=>b[0]-a[0]).forEach(([y,a])=>out.push(a.sort((p,q)=>p[0]-q[0]).map(x=>x[1]).join(' ')))}
  return out}
async function xlsLinhas(file){const X=window.XLSX||(window.parent&&window.parent.XLSX);if(!X)throw new Error('Leitor de Excel indisponível.');const wb=X.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});const out=[];
  wb.SheetNames.forEach(n=>X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false}).forEach(r=>out.push(r.map(c=>c==null?'':String(c)).join(' '))));return out}
/* ---------- cálculos ---------- */
function calc(){const it=F.itens;it.forEach(x=>{x.desc=descDe(x)});
  const T={n:it.length,v:0,d:0,e:0,conf:0,desl:0,dv:0};it.forEach(x=>{T.v+=x.valor;T.d+=x.desc;if(!x.desl&&x.conf.length&&!(x.conf.length===1&&/^Valor pago pela empresa/.test(x.conf[0])))T.conf++;if(x.desl){T.desl++;T.dv+=x.desc}});T.e=T.v-T.d;
  const C={};it.forEach(x=>{const k=x.cc||'—';const c=C[k]||(C[k]={cc:k,nome:x.ccd,n:0,v:0,d:0,L:[]});c.n++;c.v+=x.valor;c.d+=x.desc;c.L.push(x)});
  Object.values(C).forEach(c=>{const s=F.cc&&F.cc[c.cc];c.s=s||null;if(s){c.nome=s.nome||c.nome;c.depois=s.dif-c.v;c.st=s.dif<0?'est':c.depois<0?'sem':'ok'}else c.st=F.ccRef?'fora':'nd'});
  return{T,C:Object.values(C)}}
const STC={ok:['Com saldo','df-ok'],sem:['Fica sem saldo','df-am'],est:['Já estourado','df-er'],fora:['Fora do relatório de saldos','df-mu'],nd:['Carregue os saldos','df-mu']};
/* ---------- tela ---------- */
function fechar(){if(W){W.remove();W=null}}
async function abrir(){fechar();W=document.createElement('div');W.className='df-fundo';
  W.innerHTML='<div class="df-modal" role="dialog" aria-modal="true"><div class="df-cab"><h3>Desconto em folha · Cartão Convênio<small>Carregue o TXT de consumo da Sysprocard do fechamento (21 a 20). Alojados com limite de R$ 1.080 descontam metade; quem é pago pela empresa não desconta.</small></h3>'
   +'<select class="df-b" id="dfSel"></select><button class="df-b" id="dfTxt">Carregar TXT do fechamento</button><button class="df-b" id="dfAnt">Trazer do mês anterior (Excel do DP)</button><button class="df-b" id="dfSal">Carregar saldos dos centros de custo</button><button class="df-b pri" id="dfXls">Excel para o DP</button><button class="df-b" id="dfPdf">PDF do resumo</button><button class="df-b" id="dfX">Fechar</button></div><div class="df-corpo"><p>Carregando…</p></div></div>';
  document.body.appendChild(W);W.addEventListener('mousedown',e=>{if(e.target===W)fechar()});
  const g=id=>W.querySelector('#'+id);g('dfX').onclick=fechar;
  const pick=(acc,fn)=>{const i=document.createElement('input');i.type='file';i.accept=acc;i.onchange=()=>{if(i.files[0])fn(i.files[0])};i.click()};
  g('dfTxt').onclick=()=>pick('.txt,text/plain',async f=>{try{const tx=await lerTxt(f);if(!tx.fim)throw new Error('Não encontrei o período no TXT.');
      const ja=FS.find(x=>x._id===tx.fim.slice(0,7));if(ja&&!confirm('Já existe o fechamento de '+br(ja.ini)+' a '+br(ja.fim)+'. Substituir pelo TXT novo? As marcações feitas à mão serão refeitas.'))return;
      const novo=await montar(tx);if(ja){novo.cc=ja.cc||{};novo.ccRef=ja.ccRef||'';novo.ccPer=ja.ccPer||''}F=novo;await gravar();await lerTodos();desenhar('Fechamento carregado: '+F.itens.length+' pessoas.')}catch(er){desenhar('',er.message)}});
  g('dfSal').onclick=()=>{if(!F)return desenhar('','Carregue primeiro o TXT do fechamento.');pick('.pdf,.xlsx,.xls,.csv',async f=>{try{const L=/\.pdf$/i.test(f.name)?await pdfLinhas(f):await xlsLinhas(f);const r=parseSaldos(L);
      if(!Object.keys(r.CC).length)throw new Error('Não encontrei centros de custo no arquivo. Use o relatório "Saldos por Centro de Custo" do ControlOnFarm.');
      F.cc=r.CC;F.ccRef=r.ref;F.ccPer=r.per;await gravar();TAB='cc';desenhar(Object.keys(r.CC).length+' centros de custo carregados'+(r.ref?' (relatório de '+r.ref+')':'')+'.')}catch(er){desenhar('',er.message)}})};
  g('dfAnt').onclick=()=>{if(!F)return desenhar('','Carregue primeiro o TXT do fechamento.');pick('.xlsx,.xls',async f=>{try{const X=window.XLSX||(window.parent&&window.parent.XLSX);const wb=X.read(new Uint8Array(await f.arrayBuffer()),{type:'array'});
      const sh=wb.Sheets['Base']||wb.Sheets[wb.SheetNames[0]];const A=X.utils.sheet_to_json(sh,{header:1,raw:true});const hi=A.findIndex(r=>r&&r.some(c=>/^Marca/i.test(String(c||''))));if(hi<0)throw new Error('Não encontrei a aba Base com a coluna Marcação.');
      const H=A[hi].map(c=>String(c||'').trim().toUpperCase());const ix=k=>H.findIndex(h=>h.startsWith(k));const iM=ix('MARCA'),iMat=ix('MATRIC'),iCC=ix('C.CUSTO'),iD=ix('DESC. C');
      const P={};A.slice(hi+1).forEach(r=>{if(!r||r[iMat]==null)return;P[String(+r[iMat])]={marc:String(r[iM]||'').trim().toUpperCase().replace('NAO','NÃO'),cc:r[iCC]!=null?String(r[iCC]):'',ccd:r[iD]||''}});
      let nM=0,nC=0,nD=0;F.itens.forEach(x=>{const a=P[x.mat];if(!a)return;
        if(a.marc==='SIM'&&x.marc!=='SIM'&&!x.manual){x.marc='SIM';nM++;x.conf=x.conf.filter(t=>!/^Está no alojamento/.test(t));x.conf.push('Desconto de metade como no mês anterior, mas não está como alojado com limite de R$ 1.080: confirmar')}
        if(!x.cc&&a.cc){x.cc=a.cc;x.ccd=(F.cc&&F.cc[a.cc]&&F.cc[a.cc].nome)||a.ccd;x.conf=x.conf.filter(t=>!/^Sem centro de custo/.test(t));nC++}
        else if(x.cc&&a.cc&&String(x.cc)!==String(a.cc)&&!x.conf.some(t=>/^Centro de custo mudou/.test(t))){x.conf.push('Centro de custo mudou: antes '+a.cc+', agora '+x.cc);nD++}});
      await gravar();desenhar('Mês anterior: '+nM+' marcações de metade trazidas, '+nC+' centros de custo preenchidos e '+nD+' mudanças de centro de custo apontadas.')}catch(er){desenhar('',er.message)}})};
  g('dfSel').onchange=()=>{F=FS.find(x=>x._id===g('dfSel').value)||null;desenhar()};
  g('dfXls').onclick=()=>F&&excel().catch(er=>desenhar('',er.message));g('dfPdf').onclick=()=>F&&pdfRes().catch(er=>desenhar('',er.message));
  await lerTodos();F=FS[0]||null;desenhar()}
function desenhar(ok,er){if(!W)return;const g=id=>W.querySelector('#'+id),C=W.querySelector('.df-corpo');
  g('dfSel').innerHTML=FS.length?FS.map(f=>'<option value="'+e_(f._id)+'"'+(F&&F._id===f._id?' selected':'')+'>Fechamento '+br(f.ini)+' a '+br(f.fim)+'</option>').join(''):'<option>Nenhum fechamento</option>';
  ['dfXls','dfPdf','dfSal','dfAnt'].forEach(id=>g(id).disabled=!F);
  if(!F){C.innerHTML=(er?'<div class="df-av er">'+e_(er)+'</div>':'')+'<div class="df-vazio">Nenhum fechamento carregado. Clique em <b>Carregar TXT do fechamento</b> e escolha o arquivo de consumo da Sysprocard.</div>';return}
  const{T,C:CC}=calc();const sem=CC.filter(c=>c.st==='sem'),est=CC.filter(c=>c.st==='est');
  let h=(ok?'<div class="df-av in">'+e_(ok)+'</div>':'')+(er?'<div class="df-av er">'+e_(er)+'</div>':'');
  if(F.totalTxt!=null&&Math.abs(F.totalTxt-T.v)>0.02)h+='<div class="df-av er">O total lido ('+brl(T.v)+') não bate com o total do TXT ('+brl(F.totalTxt)+'). Confira o arquivo.</div>';
  const K=[['pes','','Pessoas',T.n,'no TXT da Sysprocard','#7d1a2c'],['pes','','Consumo',  'R$ '+brl(T.v),'custo total do cartão','#5c1220'],['pes','SIM','Desconto em folha','R$ '+brl(T.d),'metade dos alojados e integral dos demais','#1f3a68'],['pes','EMP','Fica com a empresa','R$ '+brl(T.e),'metade dos alojados e quem não desconta','#8a5a00'],['conf','','A conferir',T.conf,'antes de enviar ao DP','#c2410c'],['desl','','Desligados',T.desl,'R$ '+brl(T.dv)+' para a rescisão','#5d6a85'],['cc','','Centros de custo',F.ccRef?sem.length+est.length:'—',F.ccRef?sem.length+' ficam sem saldo · '+est.length+' já estourados':'carregue os saldos','#a3301c']];
  h+='<div class="df-k">'+K.map((k,i)=>'<button data-i="'+i+'" class="'+(TAB===k[0]&&FIL===k[1]?'on':'')+'" style="--kc:'+k[5]+'"><span>'+k[2]+'</span><b>'+k[3]+'</b><small>'+e_(k[4])+'</small></button>').join('')+'</div>';
  h+='<div class="df-tabs">'+[['pes','Pessoas'],['cc','Centros de custo'],['conf','A conferir ('+T.conf+')'],['desl','Desligados ('+T.desl+')']].map(t=>'<button data-t="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>';
  if(TAB==='cc'){
    if(!F.ccRef)h+='<div class="df-av in">Carregue o relatório "Saldos por Centro de Custo" (grupo Vale Refeição) em PDF ou Excel para ver quem tem saldo. O saldo é comparado com o consumo total do cartão.</div>';
    else h+='<div class="df-av in">Relatório de '+e_(F.ccRef)+(F.ccPer?' · período '+e_(F.ccPer):'')+'. Saldo depois = saldo do relatório − consumo total do cartão neste fechamento.</div>';
    const ord={est:0,sem:1,fora:2,nd:3,ok:4};const L=CC.slice().sort((a,b)=>ord[a.st]-ord[b.st]||b.v-a.v);
    h+='<div style="overflow:auto;max-height:58vh"><table class="df-tb"><thead><tr><th>C. custo</th><th>Descrição</th><th class="n">Pessoas</th><th class="n">Consumo</th><th class="n">Desconto</th><th class="n">Saldo antes</th><th class="n">Saldo depois</th><th>Situação</th></tr></thead><tbody>'
     +L.map(c=>'<tr data-cc="'+e_(c.cc)+'" style="cursor:pointer"><td>'+e_(c.cc)+'</td><td>'+e_(c.nome)+'</td><td class="n">'+c.n+'</td><td class="n">'+brl(c.v)+'</td><td class="n">'+brl(c.d)+'</td><td class="n">'+(c.s?brl(c.s.dif):'—')+'</td><td class="n">'+(c.s?brl(c.depois):'—')+'</td><td><span class="df-st '+STC[c.st][1]+'">'+STC[c.st][0]+'</span></td></tr>').join('')+'</tbody></table></div>'}
  else{let L=F.itens.slice();if(TAB==='conf')L=L.filter(x=>x.conf.length);if(TAB==='desl')L=L.filter(x=>x.desl);if(FIL==='SIM')L=L.filter(x=>x.marc==='SIM');if(FIL==='EMP')L=L.filter(x=>x.marc);if(FIL.startsWith('cc:'))L=L.filter(x=>x.cc===FIL.slice(3));
    const q=Q.trim().toLowerCase();if(q)L=L.filter(x=>(x.nome+' '+x.mat+' '+x.cc+' '+x.ccd).toLowerCase().includes(q));L.sort((a,b)=>a.nome.localeCompare(b.nome));
    h+='<div class="df-tools"><input id="dfQ" placeholder="Buscar nome, matrícula ou centro de custo" value="'+e_(Q)+'" style="flex:1;min-width:220px">'+(FIL?'<button class="df-b" id="dfLimpa">Limpar filtro</button>':'')+'<span class="df-msg">'+L.length+' pessoas · desconto R$ '+brl(L.reduce((s,x)=>s+x.desc,0))+'</span></div>'
     +'<div style="overflow:auto;max-height:58vh"><table class="df-tb"><thead><tr><th>Marcação</th><th>Nome</th><th>Matrícula</th><th class="n">Valor</th><th class="n">Desconto</th><th>C. custo</th><th>O que conferir</th></tr></thead><tbody>'
     +L.map(x=>'<tr><td><select data-m="'+e_(x.mat)+'"><option value=""'+(!x.marc?' selected':'')+'>Integral</option><option value="SIM"'+(x.marc==='SIM'?' selected':'')+'>SIM (metade)</option><option value="NÃO"'+(x.marc==='NÃO'?' selected':'')+'>NÃO (empresa)</option></select></td><td><b>'+e_(tcx(x.nome))+'</b><div style="font-size:12px;color:#5d6a85">'+e_(tcx(x.func))+'</div></td><td>'+e_(x.mat)+'</td><td class="n">'+brl(x.valor)+'</td><td class="n"><b>'+brl(x.desc)+'</b></td><td><input data-c="'+e_(x.mat)+'" value="'+e_(x.cc)+'" style="width:64px;font:inherit;font-size:12.5px;padding:3px 6px;border:1px solid #dde2ea;border-radius:6px"><div style="font-size:11.5px;color:#5d6a85">'+e_(x.ccd)+'</div></td><td style="font-size:12px;color:#8a2a1a">'+e_(x.conf.join(' · '))+'</td></tr>').join('')+'</tbody></table></div>'}
  C.innerHTML=h;
  C.querySelectorAll('.df-k [data-i]').forEach(b=>b.onclick=()=>{const k=K[+b.dataset.i];TAB=k[0];FIL=k[1];desenhar()});
  C.querySelectorAll('.df-tabs [data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;FIL='';desenhar()});
  C.querySelectorAll('[data-cc]').forEach(r=>r.onclick=()=>{TAB='pes';FIL='cc:'+r.dataset.cc;desenhar()});
  const qi=C.querySelector('#dfQ');if(qi)qi.oninput=()=>{Q=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{desenhar();const n=W.querySelector('#dfQ');n.focus();n.setSelectionRange(n.value.length,n.value.length)},300)};
  const lp=C.querySelector('#dfLimpa');if(lp)lp.onclick=()=>{FIL='';desenhar()};
  C.querySelectorAll('[data-m]').forEach(s=>s.onchange=async()=>{const x=F.itens.find(y=>y.mat===s.dataset.m);x.marc=s.value;x.manual=true;try{await gravar();desenhar('Marcação de '+tcx(x.nome)+' salva.')}catch(er){desenhar('',er.message)}});
  C.querySelectorAll('[data-c]').forEach(s=>s.onchange=async()=>{const x=F.itens.find(y=>y.mat===s.dataset.c);x.cc=s.value.trim();const c=F.cc&&F.cc[x.cc];if(c)x.ccd=c.nome;x.conf=x.conf.filter(t=>!/^Sem centro de custo/.test(t));try{await gravar();desenhar('Centro de custo de '+tcx(x.nome)+' salvo.')}catch(er){desenhar('',er.message)}})}

async function salvarArq(nome,bytes,tipo){const DL=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;if(DL)return DL.save({filename:nome,data:bytes});const u=URL.createObjectURL(new Blob([bytes],{type:tipo}));const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}
const nomeArq=ext=>'Sysprocard Convenio Desc. Folha - '+br(F.ini).slice(0,5).replace('/','-')+' a '+br(F.fim).replace(/\//g,'-')+'.'+ext;
async function excel(){const X=window.XLSX||(window.parent&&window.parent.XLSX);if(!X)throw new Error('Excel indisponível.');const{C:CC}=calc();const it=F.itens.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const MON='#,##0.00_ ;[Red]\\-#,##0.00\\ ',RS='"R$"\\ #,##0.00';
  const b=[[null,'Fechamento '+br(F.ini)+' a '+br(F.fim),null,{f:'SUBTOTAL(109,D3:D'+(it.length+2)+')',z:MON},{f:'SUBTOTAL(109,E3:E'+(it.length+2)+')',z:MON},{f:'D1-E1',z:MON}],['Marcação','Nome','Matricula','Valor(R$)','Desconto(R$)','C.CUSTO','DESC. C. CUSTO']];
  it.forEach((x,i)=>{const r=i+3;b.push([x.marc||null,x.nome,+x.mat,{v:x.valor,t:'n',z:MON},{f:'IF(A'+r+'="SIM",D'+r+'/2,IF(A'+r+'="NÃO",0,D'+r+'))',t:'n',z:MON},/^\d+$/.test(x.cc)?+x.cc:x.cc,x.ccd])});
  const ws1=X.utils.aoa_to_sheet(b);ws1['!cols']=[10,42,10,11,13,10,40].map(w=>({wch:w}));ws1['!autofilter']={ref:'A2:G'+(it.length+2)};
  const D=it.filter(x=>descDe(x)>0&&!x.desl);const d=[['Nome','Matricula',' Desconto(R$)','C.CUSTO','DESC. C. CUSTO']];D.forEach(x=>d.push([x.nome,+x.mat,{v:descDe(x),t:'n',z:RS},/^\d+$/.test(x.cc)?+x.cc:x.cc,x.ccd]));
  d.push([{f:'SUBTOTAL(102,B2:B'+(D.length+1)+')'},null,{f:'SUBTOTAL(109,C2:C'+(D.length+1)+')',z:RS},null,null]);
  const ws2=X.utils.aoa_to_sheet(d);ws2['!cols']=[42,10,15,10,40].map(w=>({wch:w}));ws2['!autofilter']={ref:'A1:E'+(D.length+1)};
  const DL=it.filter(x=>x.desl);const ws3=X.utils.aoa_to_sheet([['Nome','Matricula','Valor(R$)','Desconto(R$)','C.CUSTO','DESC. C. CUSTO','Observação']].concat(DL.map(x=>[x.nome,+x.mat,x.valor,descDe(x),x.cc,x.ccd,x.conf.join('; ')])));ws3['!cols']=[40,10,11,13,10,36,60].map(w=>({wch:w}));
  const AC=it.filter(x=>x.conf.length&&!x.desl);const ws4=X.utils.aoa_to_sheet([['Nome','Matricula','Função','Valor(R$)','Desconto(R$)','Marcação','C.CUSTO','O que conferir']].concat(AC.map(x=>[x.nome,+x.mat,x.func,x.valor,descDe(x),x.marc||'Integral',x.cc,x.conf.join('; ')])));ws4['!cols']=[40,10,30,11,13,10,9,90].map(w=>({wch:w}));
  const ord={est:0,sem:1,fora:2,nd:3,ok:4};const CL=CC.slice().sort((a,b)=>ord[a.st]-ord[b.st]||String(a.nome).localeCompare(String(b.nome)));
  const ws5=X.utils.aoa_to_sheet([[F.ccRef?'Saldos do relatório de '+F.ccRef+(F.ccPer?' (período '+F.ccPer+')':'')+' comparados com o consumo total do cartão neste fechamento.':'Saldos não carregados.'],[],['C.CUSTO','DESC. C. CUSTO','Pessoas','Consumo(R$)','Desconto em folha(R$)','Parte da empresa(R$)','Previsto(R$)','Realizado(R$)','Saldo antes(R$)','Saldo depois deste consumo(R$)','Situação']]
    .concat(CL.map(c=>[/^\d+$/.test(c.cc)?+c.cc:c.cc,c.nome,c.n,+c.v.toFixed(2),+c.d.toFixed(2),+(c.v-c.d).toFixed(2),c.s?c.s.prev:null,c.s?c.s.real:null,c.s?c.s.dif:null,c.s?+c.depois.toFixed(2):null,STC[c.st][0]])));ws5['!cols']=[9,36,8,12,13,13,12,13,13,15,24].map(w=>({wch:w}));
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws1,'Base');X.utils.book_append_sheet(wb,ws2,'Descontar');X.utils.book_append_sheet(wb,ws3,'Desligados - rescisão');X.utils.book_append_sheet(wb,ws4,'A conferir');X.utils.book_append_sheet(wb,ws5,'Centros de custo');
  await salvarArq(nomeArq('xlsx'),new Uint8Array(X.write(wb,{bookType:'xlsx',type:'array'})),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
async function pdfRes(){const J=(window.jspdf&&window.jspdf.jsPDF)||(window.parent&&window.parent.jspdf&&window.parent.jspdf.jsPDF);if(!J)throw new Error('PDF indisponível.');const{T,C:CC}=calc();

  await salvarArq(nomeArq('pdf'),new Uint8Array(doc.output('arraybuffer')),'application/pdf')}
